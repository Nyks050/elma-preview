<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Elma v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:40px;font-weight:700;letter-spacing:-3px;color:#c7c9cd}.profile{width:40px;height:40px;border-radius:50%;border:1px solid #333;background:#181818;color:#ddd}.hero{background:#141414;border:1px solid #292929;border-radius:26px;padding:18px}.hero h2{font-size:27px;margin:4px 0 14px}.transport{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}.transport-card{position:relative;min-height:86px;border:1px solid #343434;border-radius:19px;background:#1b1b1b;color:#fff;padding:13px;text-align:left;overflow:hidden}.transport-card.active{background:#f1f1f3;color:#090909;border-color:#f1f1f3}.transport-card.disabled{opacity:.52}.transport-title{font-size:16px;font-weight:800}.transport-sub{font-size:11px;display:block;margin-top:3px;opacity:.6}.transport-icon{position:absolute;right:10px;top:9px;width:45px;height:45px}.transport-icon svg{width:45px;height:45px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.soon{position:absolute;right:9px;bottom:9px;font-size:9px;font-weight:800;background:#292929;color:#aaa;padding:4px 7px;border-radius:999px}.routefield{width:100%;display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #303030;border-radius:16px;padding:13px;margin:9px 0;color:#fff;text-align:left}.dot{width:10px;height:10px;border-radius:50%;background:#ddd;box-shadow:0 0 0 4px #333;flex:0 0 auto}.dot.live{background:#35d58a}.routefield small{display:block;color:#888;font-size:11px}.routefield input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.routefield input::placeholder{color:#74777d}.cta{width:100%;border:0;border-radius:16px;padding:15px;margin-top:8px;background:#d7d8da;color:#090909;font-weight:800}.mapwrap{height:345px;border-radius:26px;overflow:hidden;position:relative;border:1px solid #292929;margin-top:16px;background:#111}.mapwrap iframe{position:absolute;left:0;top:-46px;width:100%;height:calc(100% + 92px);border:0}.toast{min-height:18px;text-align:center;color:#8c8f95;font-size:11px;margin:8px 4px 0}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="logo">elma</div><button class="profile">●</button></div>
  <div class="hero">
    <h2>Nereye gidiyorsun?</h2>

    <div class="transport">
      <button class="transport-card active">
        <span class="transport-title">Otobüs</span>
        <span class="transport-sub">Aktif</span>
        <span class="transport-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="7" width="28" height="32" rx="7"></rect><path d="M14 14h20M14 29h20"></path><circle cx="17" cy="34" r="2"></circle><circle cx="31" cy="34" r="2"></circle><path d="M15 39v3M33 39v3"></path></svg></span>
      </button>
      <button class="transport-card disabled" disabled>
        <span class="transport-title">Taksi</span>
        <span class="transport-sub">Yakında</span>
        <span class="transport-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 29l3-10a5 5 0 0 1 5-4h8a5 5 0 0 1 5 4l3 10"></path><path d="M9 29h30v8a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3v-8z"></path><path d="M19 15l1-4h8l1 4"></path><circle cx="15" cy="34" r="2"></circle><circle cx="33" cy="34" r="2"></circle></svg></span>
        <span class="soon">Yakında</span>
      </button>
    </div>

    <button class="routefield" onclick="requestLocation()">
      <div id="locDot" class="dot"></div>
      <div><small>Nereden</small><div id="locValue">Konumum</div></div>
    </button>

    <div class="routefield">
      <div class="dot"></div>
      <div style="flex:1"><small>Nereye</small><input id="destinationInput" placeholder="Anıt Meydanı, hastane, okul..." autocomplete="off"></div>
    </div>

    <button class="cta" onclick="buildRoute()">Rota bul →</button>
    <div id="toast" class="toast"></div>
  </div>

  <div class="mapwrap"><iframe id="mapFrame" src="https://www.google.com/maps?q=Amasya%20Merkez&z=14&output=embed"></iframe></div>
</main>
<script>
let currentLat=null;
let currentLng=null;
let watchId=null;
const $=id=>document.getElementById(id);

function setToast(t){$('toast').textContent=t||'';}

function requestLocation(){
  if(!navigator.geolocation){setToast('Bu cihaz konumu desteklemiyor.');return;}
  setToast('Konum alınıyor…');
  navigator.geolocation.getCurrentPosition(
    p=>{
      updateLocation(p);
      if(watchId!==null)navigator.geolocation.clearWatch(watchId);
      watchId=navigator.geolocation.watchPosition(updateLocation,()=>{}, {enableHighAccuracy:false,maximumAge:30000,timeout:20000});
    },
    err=>{
      navigator.geolocation.getCurrentPosition(updateLocation,()=>locationError(err),{enableHighAccuracy:false,maximumAge:120000,timeout:20000});
    },
    {enableHighAccuracy:true,maximumAge:30000,timeout:12000}
  );
}

function locationError(err){
  if(err&&err.code===1)setToast('Konum izni kapalı.');
  else setToast('Konum alınamadı. Tekrar dokun.');
}

function updateLocation(p){
  currentLat=p.coords.latitude;
  currentLng=p.coords.longitude;
  $('locDot').classList.add('live');
  $('locValue').textContent='Canlı konumum';
  setToast('');
  if(!$('destinationInput').value.trim()){
    $('mapFrame').src='https://www.google.com/maps?q='+currentLat+','+currentLng+'&z=17&output=embed';
  }
}

function buildRoute(){
  const destination=$('destinationInput').value.trim();
  if(!destination){setToast('Gitmek istediğin yeri yaz.');$('destinationInput').focus();return;}
  if(currentLat===null||currentLng===null){setToast('Önce Konumum bölümüne dokun.');return;}
  const start=encodeURIComponent(currentLat+','+currentLng);
  const end=encodeURIComponent(destination+', Amasya, Türkiye');
  $('mapFrame').src='https://www.google.com/maps?output=embed&saddr='+start+'&daddr='+end+'&dirflg=r';
  setToast('');
}

$('destinationInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buildRoute();}});
window.requestLocation=requestLocation;
window.buildRoute=buildRoute;
</script>
</body>
</html>
