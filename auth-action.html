<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Elma Go | Hesap işlemi</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.card{width:min(100%,480px);min-height:100dvh;margin:auto;padding:max(54px,env(safe-area-inset-top)) 26px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;text-align:center}.logo{display:block;align-self:center;width:174px;height:auto}.badge{width:92px;height:92px;margin:clamp(72px,15vh,140px) auto 27px;display:grid;place-items:center;border-radius:50%;background:#111;color:#fff;font-size:41px;font-weight:850;box-shadow:0 14px 38px rgba(0,0,0,.16)}h1{margin:0;font-size:34px;line-height:1.08;letter-spacing:-1.5px}p{max-width:340px;margin:15px auto 0;color:#77797e;font-size:16px;line-height:1.55}.field{width:100%;margin-top:18px;padding:16px 17px;border:1px solid #d9dadd;border-radius:17px;font:600 16px inherit;outline:none}.field:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.08)}button,.button{width:100%;display:block;margin-top:15px;padding:17px;border:0;border-radius:18px;background:#111;color:#fff;text-decoration:none;font-size:16px;font-weight:850;cursor:pointer}.button.secondary{margin-top:auto;background:#111;color:#fff}.hidden{display:none}.status{min-height:23px;margin-top:16px;font-size:14px;font-weight:700}.status.error{color:#b42318}.status.success{color:#16804b}.foot{margin-top:18px;color:#aaabb0;font-size:12px}@media(min-width:600px){body{background:#f4f4f5}.card{min-height:660px;margin:40px auto;border:1px solid #e6e6e8;border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.08)}.badge{margin-top:100px}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/elmago-wordmark-dark.png" alt="Elma Go">
    <div id="badge" class="badge">✓</div>
    <h1 id="title">Bağlantı kontrol ediliyor</h1>
    <p id="description">Hesap işlemin güvenli şekilde tamamlanıyor.</p>
    <section id="passwordForm" class="hidden">
      <input id="newPassword" class="field" type="password" minlength="8" autocomplete="new-password" placeholder="Yeni şifre (en az 8 karakter)">
      <input id="newPasswordAgain" class="field" type="password" minlength="8" autocomplete="new-password" placeholder="Yeni şifreyi tekrar gir">
      <button id="savePassword" type="button">Şifreyi güncelle</button>
    </section>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="foot">Bu sayfa Elma Go tarafından güvenli şekilde sunulur.</div>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
    import { getAuth, applyActionCode, checkActionCode, confirmPasswordReset, verifyPasswordResetCode } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';

    const config={apiKey:'AIzaSyBWic36WVTPG5oWUtSCJ-6MWrKWbO_w9aQ',authDomain:'elma-bd38c.firebaseapp.com',projectId:'elma-bd38c'};
    const auth=getAuth(initializeApp(config));
    auth.languageCode='tr';
    const params=new URLSearchParams(location.search);
    const mode=params.get('mode');
    const preview=params.get('preview');
    const code=params.get('oobCode');
    const continueUrl=params.get('continueUrl');
    const $=id=>document.getElementById(id);
    function view(title,description,{success=false,error=false}={}){$('title').textContent=title;$('description').textContent=description;$('badge').textContent=success?'✓':error?'!':'…';$('status').className='status'+(success?' success':error?' error':'');}
    function fail(error){console.error(error);view('Bağlantı kullanılamıyor','Bu bağlantının süresi dolmuş veya bağlantı daha önce kullanılmış olabilir.',{error:true});$('status').textContent='Uygulamadan yeni bir bağlantı isteyebilirsin.';}

    async function run(){
      if(preview==='success'){view('E-postan doğrulandı','Hesabın hazır. Artık Elma Go’ya güvenle giriş yapabilirsin.',{success:true});$('status').textContent='Doğrulama başarıyla tamamlandı.';return;}
      if(!code)return fail(new Error('missing-code'));
      try{
        if(mode==='verifyEmail'){
          await applyActionCode(auth,code);
          view('E-postan doğrulandı','Hesabın hazır. Artık Elma Go’ya giriş yapabilirsin.',{success:true});
          $('status').textContent='Doğrulama başarıyla tamamlandı.';
        }else if(mode==='resetPassword'){
          await verifyPasswordResetCode(auth,code);
          view('Yeni şifreni oluştur','Elma Go hesabın için en az 8 karakterli yeni bir şifre belirle.',{button:false});
          $('passwordForm').classList.remove('hidden');
        }else if(mode==='recoverEmail'){
          await checkActionCode(auth,code);
          await applyActionCode(auth,code);
          view('E-posta adresin geri alındı','Hesabındaki e-posta değişikliği güvenli şekilde geri çevrildi.',{success:true});
        }else fail(new Error('unsupported-mode'));
      }catch(error){fail(error);}
    }

    $('savePassword').addEventListener('click',async()=>{
      const first=$('newPassword').value,second=$('newPasswordAgain').value;
      $('status').className='status error';
      if(first.length<8){$('status').textContent='Şifre en az 8 karakter olmalı.';return;}
      if(first!==second){$('status').textContent='Şifreler birbiriyle aynı değil.';return;}
      $('savePassword').disabled=true;$('status').textContent='';
      try{await confirmPasswordReset(auth,code,first);$('passwordForm').classList.add('hidden');view('Şifren güncellendi','Yeni şifrenle Elma Go’ya giriş yapabilirsin.',{success:true});$('status').textContent='Şifre değişikliği tamamlandı.';}catch(error){$('savePassword').disabled=false;fail(error);}
    });
    run();
  </script>
</body>
</html>
