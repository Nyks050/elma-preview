<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ElmaGo — Nasıl giderim? Taslak 1</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:light;--ink:#09090b;--muted:#707176;--line:#dedee2;--soft:#f5f5f6}
    html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{width:100%;max-width:520px;min-height:100dvh;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom))}
    .head{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 24px}
    h1{margin:0;font-size:38px;line-height:1.04;font-weight:850;letter-spacing:-1.7px}
    .help{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center}
    .help svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .planner{position:relative;border:1px solid var(--line);border-radius:27px;padding:15px;background:#fff;box-shadow:0 14px 34px rgba(20,20,25,.07)}
    .field{height:66px;border:1px solid #e1e1e4;border-radius:19px;background:#fff;display:flex;align-items:center;gap:13px;padding:0 15px}
    .field+.field{margin-top:11px}
    .field svg{width:26px;height:26px;flex:0 0 26px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .field input{min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;font-weight:560;letter-spacing:-.25px}
    .field input::placeholder{color:#85868b}
    .clear{width:29px;height:29px;flex:0 0 29px;border:0;border-radius:50%;background:#f0f0f1;color:#77787c;font-size:17px;display:none}
    .field.has-value .clear{display:grid;place-items:center}
    .swap{position:absolute;right:31px;top:76px;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#f5f5f6;color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 9px #0000000d}
    .swap svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .go{width:100%;height:60px;margin-top:14px;border:0;border-radius:20px;background:#0b0b0d;color:#fff;font-size:17px;font-weight:820;letter-spacing:-.25px}
    .go:active,.recent:active{transform:scale(.985)}
    .go:disabled{background:#d6d6d9;color:#8a8b90}
    .section{margin-top:20px;border:1px solid var(--line);border-radius:27px;overflow:hidden;background:#fff}
    .section-title{padding:17px 17px 8px;color:#7b7c81;font-size:11px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .recent{width:100%;min-height:73px;border:0;border-top:1px solid #ececef;background:#fff;color:var(--ink);display:grid;grid-template-columns:44px minmax(0,1fr) 20px;align-items:center;gap:12px;padding:10px 16px;text-align:left}
    .section-title+.recent{border-top:0}
    .recent-icon{width:44px;height:44px;border-radius:15px;background:var(--soft);display:grid;place-items:center}
    .recent-icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .recent-copy{min-width:0}
    .recent-copy b,.recent-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .recent-copy b{font-size:15px;font-weight:780;letter-spacing:-.2px}
    .recent-copy small{margin-top:4px;color:var(--muted);font-size:12px}
    .arrow{color:#999a9f;font-size:26px;font-weight:350}
    .result{display:none;margin-top:20px;border:1px solid var(--line);border-radius:27px;background:#fff;padding:18px;box-shadow:0 14px 34px rgba(20,20,25,.07)}
    .result.show{display:block;animation:rise .25s ease both}
    .result-top{display:flex;align-items:center;gap:12px}
    .result-bus{width:47px;height:47px;border-radius:15px;background:#0b0b0d;color:#fff;display:grid;place-items:center}
    .result-bus svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .result-copy{flex:1;min-width:0}
    .result-copy b{display:block;font-size:16px}
    .result-copy small{display:block;margin-top:3px;color:var(--muted);font-size:12px}
    .duration{font-size:21px;font-weight:850;letter-spacing:-.5px}
    .steps{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:15px;padding-top:14px;border-top:1px solid #ececef;color:#5f6065;font-size:12px;font-weight:680}
    .step{padding:7px 9px;border-radius:10px;background:var(--soft)}
    .step.dark{background:#0b0b0d;color:#fff}
    .tabs{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:calc(82px + env(safe-area-inset-bottom));padding:7px 11px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #e2e2e5;background:rgba(255,255,255,.97);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;backdrop-filter:blur(18px)}
    .tab{position:relative;border:0;border-radius:18px;background:transparent;color:#66676c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px 1px;font-size:10.5px;font-weight:680}
    .tab svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .tab.active{background:#0b0b0d;color:#fff}
    .tab.qr{background:transparent;color:#09090b}
    .tab.qr span:first-child{width:54px;height:54px;margin-top:-17px;border-radius:15px;background:#0b0b0d;color:#fff;display:grid;place-items:center;box-shadow:0 7px 16px #0003}
    .tab.qr svg{width:31px;height:31px}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media(max-width:390px){h1{font-size:34px}.app{padding-left:15px;padding-right:15px}.planner{padding:13px;border-radius:24px}.field{height:61px}.swap{right:28px;top:69px}.go{height:56px}.recent{min-height:68px}.tabs{height:calc(78px + env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>Nasıl giderim?</h1>
      <button class="help" type="button" aria-label="Yardım" onclick="alert('Başlangıç ve varış noktasını seç, ardından Rota bul düğmesine bas.')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.5 2.5 0 0 1 4.8 1c0 2-2.5 2.2-2.5 4M12 17h.01"/></svg></button>
    </header>

    <section class="planner" aria-label="Rota planlayıcı">
      <label class="field has-value" id="fromField">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        <input id="from" value="Mevcut konumum" placeholder="Nereden?" autocomplete="off">
        <button class="clear" type="button" aria-label="Başlangıcı temizle" data-clear="from">×</button>
      </label>
      <button class="swap" id="swap" type="button" aria-label="Başlangıç ve varış yerini değiştir"><svg viewBox="0 0 24 24"><path d="M8 4v15M5 7l3-3 3 3M16 20V5M13 17l3 3 3-3"/></svg></button>
      <label class="field" id="toField">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-13a7 7 0 1 0-14 0c0 6.8 7 13 7 13z"/><circle cx="12" cy="8" r="2.3"/></svg>
        <input id="to" placeholder="Nereye?" autocomplete="off">
        <button class="clear" type="button" aria-label="Varışı temizle" data-clear="to">×</button>
      </label>
      <button class="go" id="go" type="button" disabled>Rota bul</button>
    </section>

    <section class="result" id="result" aria-live="polite">
      <div class="result-top">
        <span class="result-bus"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="16" rx="3"/><path d="M7.5 8h9M8 19.5v2M16 19.5v2"/><circle cx="8.5" cy="15.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/></svg></span>
        <span class="result-copy"><b id="resultTitle">Rota hazır</b><small>En uygun toplu taşıma seçeneği</small></span>
        <span class="duration">18 dk</span>
      </div>
      <div class="steps"><span class="step">4 dk yürü</span><span>›</span><span class="step dark">Hat 1</span><span>›</span><span class="step">3 dk yürü</span></div>
    </section>

    <section class="section" id="recentSection">
      <div class="section-title">Son gittiklerim</div>
      <button class="recent" type="button" data-place="Ev"><span class="recent-icon"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg></span><span class="recent-copy"><b>Ev</b><small>Amasya Merkez, Amasya</small></span><span class="arrow">›</span></button>
      <button class="recent" type="button" data-place="İş"><span class="recent-icon"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="13" rx="2"/><path d="M9 7V5h6v2M5 12h14"/></svg></span><span class="recent-copy"><b>İş</b><small>Amasya Merkez, Amasya</small></span><span class="arrow">›</span></button>
      <button class="recent" type="button" data-place="Amasya Otogarı"><span class="recent-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="16" rx="3"/><path d="M7 8h10M8 19v2M16 19v2"/><circle cx="8.5" cy="15" r="1"/><circle cx="15.5" cy="15" r="1"/></svg></span><span class="recent-copy"><b>Amasya Otogarı</b><small>Dere Mahallesi, Amasya</small></span><span class="arrow">›</span></button>
      <button class="recent" type="button" data-place="Amasya Devlet Hastanesi"><span class="recent-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg></span><span class="recent-copy"><b>Amasya Devlet Hastanesi</b><small>Pirinççi Mahallesi, Amasya</small></span><span class="arrow">›</span></button>
    </section>
  </main>

  <nav class="tabs" aria-label="Ana menü">
    <button class="tab active" type="button"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2.5"/><path d="M7.5 18h9a3 3 0 0 0 0-6h-9a3 3 0 1 1 0-6H16"/><circle cx="18" cy="6" r="2.5"/></svg><span>Ulaşım</span></button>
    <button class="tab" type="button"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Şehir</span></button>
    <button class="tab qr" type="button"><span><svg viewBox="0 0 32 32"><path d="M3 3h9v9H3zM20 3h9v9h-9zM3 20h9v9H3zM6 6h3v3H6zM23 6h3v3h-3zM6 23h3v3H6zM17 18h4v4h-4zM25 18h4v4h-4zM17 26h4v4h-4zM25 26h4v4h-4z"/></svg></span><span>QR</span></button>
    <button class="tab" type="button"><svg viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="17" height="13" rx="2.5"/><path d="M8 7.5V5.8A2.8 2.8 0 0 1 10.8 3h2.4A2.8 2.8 0 0 1 16 5.8v1.7M8.5 14h7M12 10.5v7"/></svg><span>İlanlar</span></button>
    <button class="tab" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.2 20v-1.5a6.8 6.8 0 0 1 13.6 0V20z"/></svg><span>Hesap</span></button>
  </nav>

  <script>
    const from=document.getElementById('from');
    const to=document.getElementById('to');
    const go=document.getElementById('go');
    const result=document.getElementById('result');
    const sync=()=>{
      document.getElementById('fromField').classList.toggle('has-value',Boolean(from.value.trim()));
      document.getElementById('toField').classList.toggle('has-value',Boolean(to.value.trim()));
      go.disabled=!(from.value.trim()&&to.value.trim());
      result.classList.remove('show');
    };
    [from,to].forEach(input=>input.addEventListener('input',sync));
    document.querySelectorAll('[data-clear]').forEach(button=>button.onclick=event=>{
      event.preventDefault();
      const input=document.getElementById(button.dataset.clear);
      input.value='';input.focus();sync();
    });
    document.getElementById('swap').onclick=()=>{const old=from.value;from.value=to.value;to.value=old;sync()};
    document.querySelectorAll('[data-place]').forEach(button=>button.onclick=()=>{to.value=button.dataset.place;sync();to.focus()});
    go.onclick=()=>{document.getElementById('resultTitle').textContent=to.value+' rotası';result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'nearest'})};
    sync();
  </script>
</body>
</html>
