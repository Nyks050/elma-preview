name: Release backend checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-and-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify backend syntax and account security regressions
        run: |
          node --check functions/index.js
          node --check functions/listing-moderation.js
          node --check email-auth.js
          node --test tests/account-deletion.test.cjs
          node --test functions/listing-moderation.test.js functions/moderation-guard.test.js functions/report-email.test.js

