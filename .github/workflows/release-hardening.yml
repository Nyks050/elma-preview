name: Release backend checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-and-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify backend syntax and account security regressions
        run: |
          node --check functions/index.js
          node --check functions/listing-moderation.js
          node --check email-auth.js
          node --test tests/account-deletion.test.cjs

