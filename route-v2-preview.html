<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f3">
  <title>ElmaGo — Harita tabanlı rota taslağı</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#101113;background:#efefed}button,input{font:inherit}.shell{position:relative;width:100%;max-width:520px;height:100%;min-height:650px;margin:auto;overflow:hidden;background:#f7f7f5}.app-head{position:absolute;z-index:510;inset:0 0 auto;height:112px;padding:calc(35px + env(safe-area-inset-top)) 24px 17px;background:#fff;border-bottom:1px solid #ececee}.app-head h1{margin:0;font-size:32px;line-height:1;letter-spacing:-1.6px}.map{position:absolute;z-index:1;inset:112px 0 78px;filter:saturate(.48) contrast(.88) brightness(1.08)}.leaflet-control-attribution{font-size:8px!important;background:#ffffffd9!important}.leaflet-control-zoom{display:none}.map-locate{position:absolute;z-index:450;right:18px;top:145px;width:53px;height:53px;border:1px solid #dedfe1;border-radius:50%;background:#fffffff2;color:#111;font-size:25px;box-shadow:0 8px 20px #1112}.route-ui{position:absolute;z-index:520;left:0;right:0;bottom:78px;min-height:360px;padding:10px 20px 17px;border-radius:28px 28px 0 0;background:#fff;box-shadow:0 -8px 30px #1112}.drag{width:49px;height:5px;margin:0 auto 14px;border-radius:99px;background:#d0d1d3}.fields{position:relative;padding-right:51px}.field{display:grid;grid-template-columns:25px minmax(0,1fr) 28px;align-items:center;gap:10px;height:58px;padding:0 11px;border:1px solid #dedfe2;border-radius:17px;background:#fff}.field+.field{margin-top:10px}.field.active{border-color:#111;box-shadow:0 0 0 1px #111}.dot{width:21px;height:21px;margin:auto;border:2px solid #111;border-radius:50%;background:#fff;position:relative}.dot:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#111}.destination .dot{border-radius:50%;border:0}.destination .dot:before{content:"";position:absolute;left:4px;top:1px;width:12px;height:16px;border:2px solid #111;border-radius:9px 9px 9px 0;transform:rotate(-45deg)}.destination .dot:after{inset:auto;left:9px;top:6px;width:4px;height:4px;background:#111}.field input{min-width:0;width:100%;height:54px;border:0;outline:0;background:transparent;color:#111;font-size:15px;font-weight:720}.field input::placeholder{color:#7d8085;font-weight:570}.clear{width:27px;height:27px;border:0;background:transparent;color:#777b80;font-size:19px}.swap{position:absolute;right:0;top:38px;width:42px;height:48px;border:0;border-radius:14px;background:#f2f2f3;color:#111;font-size:22px;font-weight:800}.manual-hint{margin:9px 2px 0;color:#787b80;font-size:10px;font-weight:650}.suggestions{position:absolute;z-index:10;left:0;right:51px;top:67px;max-height:230px;overflow:auto;border:1px solid #dedfe1;border-radius:18px;background:#fff;box-shadow:0 15px 35px #1113}.suggestions[hidden]{display:none}.suggestion{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-bottom:1px solid #eee;background:#fff;color:#111;text-align:left}.suggestion:last-child{border-bottom:0}.suggestion:active{background:#f0f1f2}.suggestion-icon{width:38px;height:38px;border-radius:12px;background:#f0f1f2;display:grid;place-items:center;font-size:18px}.suggestion b,.suggestion small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.suggestion b{font-size:13px}.suggestion small{margin-top:3px;color:#777a80;font-size:10px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.mode{height:51px;border:1px solid #e1e1e3;border-radius:15px;background:#f5f5f5;color:#111;font-size:12px;font-weight:800}.mode span{margin-right:7px;font-size:19px;vertical-align:-2px}.mode.active{border-color:#111;background:#111;color:#fff}.route-button{width:100%;height:58px;margin-top:13px;border:0;border-radius:18px;background:#111;color:#fff;font-size:16px;font-weight:850}.route-button:disabled{background:#d5d6d8;color:#898c91}.message{display:none;position:absolute;z-index:12;left:20px;right:20px;bottom:calc(100% + 12px);padding:12px 14px;border-radius:14px;background:#111;color:#fff;font-size:11px;font-weight:680;line-height:1.4;box-shadow:0 8px 22px #1113}.message.show{display:block}.message.error{background:#a52727}.pin{width:27px;height:27px;border:3px solid #fff;border-radius:50% 50% 50% 0;background:#111;box-shadow:0 4px 12px #0005;transform:rotate(-45deg)}.pin.dest{background:#fff;border-color:#111}.pin span{display:block;width:7px;height:7px;margin:7px;border-radius:50%;background:#fff}.pin.dest span{background:#111}.leaflet-marker-icon.pin{margin:-25px 0 0 -13px!important}.leaflet-marker-icon.pin span{transform:rotate(45deg)}.sheet{display:none;margin-top:13px;padding:12px;border:1px solid #e1e1e3;border-radius:17px;background:#f7f7f8}.sheet.show{display:block}.sheet-top{display:flex;align-items:center;gap:10px}.line-badge{width:42px;height:42px;border-radius:13px;background:#111;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900}.sheet-copy{flex:1;min-width:0}.sheet-copy b{display:block;font-size:13px}.sheet-copy small{display:block;margin-top:3px;color:#72757b;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duration{text-align:right;font-size:18px;font-weight:900}.steps{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid #e4e4e6;color:#686b70;font-size:9px;font-weight:750}.steps b{color:#111}.step-arrow{color:#a4a6aa}.nav{position:absolute;z-index:540;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);padding:8px 7px env(safe-area-inset-bottom);border-top:1px solid #dfe0e1;background:#fffffff4;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#686b70;font-size:10px;font-weight:740}.nav button span{display:block;margin:auto auto 4px;font-size:21px}.nav .active{color:#111}.nav .active span{width:40px;height:35px;padding-top:5px;border-radius:13px;background:#111;color:#fff}.map-tip{position:absolute;z-index:490;left:50%;top:34%;width:max-content;max-width:82%;padding:9px 12px;border-radius:13px;background:#111e;color:#fff;font-size:10px;font-weight:740;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:.2s}.map-tip.show{opacity:1}.loading{position:absolute;z-index:700;inset:112px 0 78px;background:#f1f2ef;display:grid;place-items:center;font-weight:850;letter-spacing:-.5px}.loading.hide{display:none}@media(max-height:760px){.app-head{height:94px;padding-top:calc(24px + env(safe-area-inset-top))}.app-head h1{font-size:28px}.map{inset:94px 0 78px}.map-locate{top:118px}.route-ui{min-height:337px;padding-bottom:12px}.field{height:53px}.field input{height:50px}.mode{height:46px}.route-button{height:52px}.sheet.show{position:absolute;left:20px;right:20px;bottom:12px;background:#fff}.route-ui.has-result .fields,.route-ui.has-result .modes,.route-ui.has-result .route-button,.route-ui.has-result .manual-hint{opacity:.18;pointer-events:none}}@media(max-width:360px){.route-ui{padding-left:14px;padding-right:14px}.fields{padding-right:47px}.mode span{margin-right:3px}.message{left:14px;right:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="app-head"><h1>Nasıl giderim?</h1></header>
    <div id="map" class="map" aria-label="Amasya toplu taşıma rota haritası"></div>
    <button class="map-locate" id="locate" type="button" aria-label="Konumumu kullan">⌾</button>
    <div class="loading" id="loading">ElmaGo haritayı hazırlıyor…</div>
    <section class="route-ui" id="planner" aria-label="Rota arama">
      <div class="drag" aria-hidden="true"></div>
      <div class="fields">
        <label class="field origin" id="originField"><span class="dot"></span><input id="originInput" autocomplete="off" placeholder="Nereden?"><button class="clear" id="clearOrigin" type="button" aria-label="Başlangıcı temizle">⋮</button></label>
        <label class="field destination" id="destinationField"><span class="dot"></span><input id="destinationInput" autocomplete="off" placeholder="Nereye?"><button class="clear" id="clearDestination" type="button" aria-label="Varışı temizle">⋮</button></label>
        <button class="swap" id="swap" type="button" aria-label="Başlangıç ve varışı değiştir">⇅</button>
        <div class="suggestions" id="suggestions" hidden></div>
      </div>
      <div class="manual-hint">Bir kutuya dokun, ardından konumu haritada elle seçebilirsin.</div>
      <div class="modes" aria-label="Ulaşım türü"><button class="mode active" type="button" data-mode="bus"><span>▣</span>Otobüs</button><button class="mode" type="button" data-mode="walk"><span>♟</span>Yürüyüş</button><button class="mode" type="button" data-mode="car"><span>▰</span>Araç</button></div>
      <button class="route-button" id="routeButton" type="button" disabled>Rotayı göster</button>
      <div class="message" id="message"></div>
      <section class="sheet" id="sheet" aria-live="polite">
        <div class="sheet-top"><div class="line-badge" id="lineBadge">1</div><div class="sheet-copy"><b id="routeTitle">En yakın uygun hat</b><small id="routeSubtitle"></small></div><div class="duration" id="duration">—</div></div>
        <div class="steps"><b id="walkStart">—</b><span>yürü</span><span class="step-arrow">›</span><b id="rideLine">Hat —</b><span class="step-arrow">›</span><b id="walkEnd">—</b><span>yürü</span></div>
      </section>
    </section>
    <div class="map-tip show" id="mapTip">Başlangıç kutusunu seçip haritaya dokun</div>
    <nav class="nav" aria-label="Ana menü"><button type="button"><span>☷</span>Ulaşım</button><button class="active" type="button"><span>⌖</span>Şehir</button><button type="button"><span>▦</span>QR</button><button type="button"><span>▣</span>İlanlar</button><button type="button"><span>♙</span>Hesap</button></nav>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (()=>{
    const AMASYA=[40.65,35.83],MAX_WALK=1000;
    const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(AMASYA,13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap katkıda bulunanlar'}).addTo(map);
    const ui={loading:document.getElementById('loading'),planner:document.getElementById('planner'),originInput:document.getElementById('originInput'),destinationInput:document.getElementById('destinationInput'),originField:document.getElementById('originField'),destinationField:document.getElementById('destinationField'),suggestions:document.getElementById('suggestions'),routeButton:document.getElementById('routeButton'),mapTip:document.getElementById('mapTip'),message:document.getElementById('message'),sheet:document.getElementById('sheet')};
    const state={mode:'origin',origin:null,destination:null,originMarker:null,destinationMarker:null,lines:[],routeLayers:[],pending:null,timer:null,searchController:null};
    const localPlaces=[
      {name:'Amasya Otogarı',detail:'Dere Mahallesi, Amasya',lat:40.66848,lng:35.8372},
      {name:'Amasya Devlet Hastanesi',detail:'Pirinççi Mahallesi, Amasya',lat:40.6553,lng:35.8127},
      {name:'Amasya Üniversitesi',detail:'Akbilek Mahallesi, Amasya',lat:40.6494,lng:35.7909},
      {name:'Yavuz Selim Meydanı',detail:'Merkez, Amasya',lat:40.6505,lng:35.8332},
      {name:'Amasya Kalesi',detail:'Hatuniye Mahallesi, Amasya',lat:40.6577,lng:35.8278},
      {name:'Ferhat ile Şirin Müzesi',detail:'Helvacı Mahallesi, Amasya',lat:40.6419,lng:35.8080}
    ];
    const rad=x=>x*Math.PI/180;
    function distance(a,b){const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng),v=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;return 12742000*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}
    const point=value=>({lat:Number(value.lat??value[0]),lng:Number(value.lng??value[1])});
    const metres=value=>value<1000?Math.round(value/10)*10+' m':(value/1000).toFixed(1).replace('.',',')+' km';
    const minutes=value=>Math.max(1,Math.round(value/80));
    function showMessage(text,error=false){ui.message.textContent=text;ui.message.className='message show'+(error?' error':'');clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>ui.message.className='message',4200)}
    function setMode(mode){state.mode=mode;ui.originField.classList.toggle('active',mode==='origin');ui.destinationField.classList.toggle('active',mode==='destination');ui.mapTip.textContent=mode==='origin'?'Başlangıç noktasını haritadan seç':'Varış noktasını haritadan seç';ui.mapTip.classList.add('show');setTimeout(()=>ui.mapTip.classList.remove('show'),2200)}
    function nearestForPoint(location,line){let best=null;(line.stops||[]).forEach((stop,index)=>{const p=point(stop),d=distance(location,p);if(!best||d<best.distance)best={point:p,distance:d,index,name:stop.name||('Durak '+(index+1))}});return best}
    function nearestAny(location){let best=null;state.lines.forEach(line=>{const hit=nearestForPoint(location,line);if(hit&&(!best||hit.distance<best.distance))best={...hit,line}});return best}
    function markerIcon(kind){return L.divIcon({className:'pin '+(kind==='destination'?'dest':''),html:'<span></span>',iconSize:[27,27],iconAnchor:[13,27]})}
    function clearRoutes(){state.routeLayers.forEach(layer=>map.removeLayer(layer));state.routeLayers=[];ui.sheet.classList.remove('show');ui.planner.classList.remove('has-result')}
    function updateMarker(kind,location,label){const key=kind+'Marker';if(state[key])map.removeLayer(state[key]);state[key]=L.marker([location.lat,location.lng],{icon:markerIcon(kind),zIndexOffset:1000}).addTo(map).bindTooltip(label,{direction:'top',offset:[0,-20]});state[kind]={...location,label};(kind==='origin'?ui.originInput:ui.destinationInput).value=label;clearRoutes();if(state.origin&&state.destination)prepareRoute();else{state.pending=null;ui.routeButton.disabled=true;if(kind==='origin')setMode('destination')}}
    function acceptLocation(kind,location,label){const nearest=nearestAny(location);if(!nearest||nearest.distance>MAX_WALK){showMessage('Bu noktaya '+Math.round(MAX_WALK/1000*10)/10+' km içinde toplu taşıma hattı yok. Başka bir nokta seç.',true);return false}updateMarker(kind,location,label);showMessage('Nokta kabul edildi · En yakın: Hat '+nearest.line.number+' · '+metres(nearest.distance));return true}
    function routeIndex(route,stop){let best={index:0,distance:Infinity};route.forEach((item,index)=>{const d=distance(stop,point(item));if(d<best.distance)best={index,distance:d}});return best.index}
    function bestCommonLine(){let best=null;state.lines.forEach(line=>{const a=nearestForPoint(state.origin,line),b=nearestForPoint(state.destination,line);if(!a||!b||a.distance>MAX_WALK||b.distance>MAX_WALK)return;const score=a.distance+b.distance;if(!best||score<best.score)best={line,a,b,score}});return best}
    function prepareRoute(){state.pending=bestCommonLine();ui.routeButton.disabled=!state.pending;if(state.pending)showMessage('Uygun hat bulundu: Hat '+state.pending.line.number+' · Rotayı göster düğmesine bas.');else showMessage('Bu iki noktayı bağlayan yakın bir hat yok. Başka bir nokta seç.',true)}
    function buildRoute(){clearRoutes();const best=state.pending||bestCommonLine();if(!best){ui.routeButton.disabled=true;showMessage('Bu iki noktayı birbirine bağlayan yakın bir hat bulunamadı. Varış veya başlangıç noktasını değiştir.',true);return}const {line,a,b}=best,route=(line.route||[]).map(point);if(route.length<2){showMessage('Bu hattın güzergâh verisi hazır değil.',true);return}const i1=routeIndex(route,a.point),i2=routeIndex(route,b.point),segment=i1<=i2?route.slice(i1,i2+1):route.slice(i2,i1+1).reverse();const walk1=L.polyline([[state.origin.lat,state.origin.lng],[a.point.lat,a.point.lng]],{color:'#111',weight:4,dashArray:'2 9'}).addTo(map);const transit=L.polyline(segment.map(p=>[p.lat,p.lng]),{color:'#111',weight:7,opacity:.9,lineCap:'round'}).addTo(map);const walk2=L.polyline([[b.point.lat,b.point.lng],[state.destination.lat,state.destination.lng]],{color:'#111',weight:4,dashArray:'2 9'}).addTo(map);const s1=L.circleMarker([a.point.lat,a.point.lng],{radius:7,color:'#fff',weight:3,fillColor:'#111',fillOpacity:1}).addTo(map);const s2=L.circleMarker([b.point.lat,b.point.lng],{radius:7,color:'#fff',weight:3,fillColor:'#111',fillOpacity:1}).addTo(map);state.routeLayers=[walk1,transit,walk2,s1,s2];const bounds=L.latLngBounds([[state.origin.lat,state.origin.lng],[state.destination.lat,state.destination.lng],...segment.map(p=>[p.lat,p.lng])]);map.fitBounds(bounds,{paddingTopLeft:[24,105],paddingBottomRight:[24,300],maxZoom:15});const rideDistance=segment.slice(1).reduce((sum,p,i)=>sum+distance(segment[i],p),0),total=minutes(a.distance)+minutes(b.distance)+Math.max(3,Math.round(rideDistance/330));document.getElementById('lineBadge').textContent=line.number;document.getElementById('routeTitle').textContent='Hat '+line.number+' ile en uygun rota';document.getElementById('routeSubtitle').textContent=(line.frequency||'Yakındaki hat')+' · '+a.name+' → '+b.name;document.getElementById('duration').textContent=total+' dk';document.getElementById('walkStart').textContent=minutes(a.distance)+' dk';document.getElementById('rideLine').textContent='Hat '+line.number;document.getElementById('walkEnd').textContent=minutes(b.distance)+' dk';ui.sheet.classList.add('show');ui.planner.classList.add('has-result')}
    function formatFeature(feature){const p=feature.properties||{},coords=feature.geometry?.coordinates||[];return{name:p.name||p.street||p.city||'Seçilen konum',detail:[p.district,p.city,p.state].filter(Boolean).join(', ')||'Amasya',lat:Number(coords[1]),lng:Number(coords[0])}}
    function renderSuggestions(items){ui.suggestions.replaceChildren();items.slice(0,6).forEach(item=>{const button=document.createElement('button');button.type='button';button.className='suggestion';button.innerHTML='<span class="suggestion-icon">⌖</span><span><b></b><small></small></span>';button.querySelector('b').textContent=item.name;button.querySelector('small').textContent=item.detail;button.onclick=()=>{ui.suggestions.hidden=true;acceptLocation(state.mode,{lat:item.lat,lng:item.lng},item.name);map.setView([item.lat,item.lng],15)};ui.suggestions.appendChild(button)});ui.suggestions.hidden=!items.length}
    async function search(query){const local=localPlaces.filter(item=>(item.name+' '+item.detail).toLocaleLowerCase('tr-TR').includes(query.toLocaleLowerCase('tr-TR')));if(query.length<2){renderSuggestions(local);return}state.searchController?.abort();state.searchController=new AbortController();try{const url='https://photon.komoot.io/api/?q='+encodeURIComponent(query+', Amasya')+'&lat=40.65&lon=35.83&limit=6&lang=tr';const response=await fetch(url,{signal:state.searchController.signal});const data=await response.json();const remote=(data.features||[]).map(formatFeature).filter(item=>Number.isFinite(item.lat)&&Number.isFinite(item.lng));const seen=new Set();renderSuggestions([...local,...remote].filter(item=>{const key=item.name+'|'+item.lat.toFixed(4);if(seen.has(key))return false;seen.add(key);return true}))}catch(error){if(error.name!=='AbortError')renderSuggestions(local)}}
    function bindInput(input,mode){input.addEventListener('focus',()=>{setMode(mode);search(input.value.trim())});input.addEventListener('input',()=>{setMode(mode);clearTimeout(state.timer);state.timer=setTimeout(()=>search(input.value.trim()),220)})}
    function clearPoint(kind){if(state[kind+'Marker'])map.removeLayer(state[kind+'Marker']);state[kind+'Marker']=null;state[kind]=null;state.pending=null;ui.routeButton.disabled=true;(kind==='origin'?ui.originInput:ui.destinationInput).value='';clearRoutes();setMode(kind)}
    function swapPoints(){const origin=state.origin,destination=state.destination;if(!origin&&!destination)return;[state.originMarker,state.destinationMarker].forEach(marker=>marker&&map.removeLayer(marker));state.origin=destination;state.destination=origin;state.originMarker=state.origin?L.marker([state.origin.lat,state.origin.lng],{icon:markerIcon('origin'),zIndexOffset:1000}).addTo(map):null;state.destinationMarker=state.destination?L.marker([state.destination.lat,state.destination.lng],{icon:markerIcon('destination'),zIndexOffset:1000}).addTo(map):null;ui.originInput.value=state.origin?.label||'';ui.destinationInput.value=state.destination?.label||'';clearRoutes();if(state.origin&&state.destination)prepareRoute();else{state.pending=null;ui.routeButton.disabled=true;setMode(state.origin?'destination':'origin')}}
    async function locate(){if(!navigator.geolocation){showMessage('Bu cihaz konum seçimini desteklemiyor.',true);return}showMessage('Konumun alınıyor…');navigator.geolocation.getCurrentPosition(pos=>{const location={lat:pos.coords.latitude,lng:pos.coords.longitude};if(acceptLocation('origin',location,'Mevcut konumum'))map.setView([location.lat,location.lng],15)},()=>showMessage('Konum izni alınamadı. Haritaya dokunarak seçebilirsin.',true),{enableHighAccuracy:true,timeout:9000,maximumAge:60000})}
    map.on('click',event=>{ui.suggestions.hidden=true;acceptLocation(state.mode,{lat:event.latlng.lat,lng:event.latlng.lng},state.mode==='origin'?'Haritadan seçilen başlangıç':'Haritadan seçilen varış')});
    document.getElementById('locate').onclick=locate;document.getElementById('clearOrigin').onclick=()=>clearPoint('origin');document.getElementById('clearDestination').onclick=()=>clearPoint('destination');document.getElementById('swap').onclick=swapPoints;ui.routeButton.onclick=buildRoute;document.querySelectorAll('.mode').forEach(button=>button.onclick=()=>{if(button.dataset.mode!=='bus')showMessage('Bu taslak en yakın otobüs hattını bulmaya odaklı.');document.querySelectorAll('.mode').forEach(item=>item.classList.toggle('active',item===button));if(button.dataset.mode!=='bus')setTimeout(()=>{document.querySelector('[data-mode="bus"]').click()},900)});bindInput(ui.originInput,'origin');bindInput(ui.destinationInput,'destination');document.addEventListener('click',event=>{if(!event.target.closest('.route-ui'))ui.suggestions.hidden=true});
