<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f3">
  <title>ElmaGo — Harita tabanlı rota taslağı</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#101113;background:#eef0ed}button,input{font:inherit}.shell{position:relative;width:100%;max-width:520px;height:100%;min-height:620px;margin:auto;overflow:hidden;background:#e8ebe6}.map{position:absolute;inset:0 0 78px}.leaflet-control-attribution{font-size:9px!important;background:#ffffffde!important}.leaflet-control-zoom{display:none}.route-ui{position:absolute;z-index:500;inset:0 0 auto;padding:calc(12px + env(safe-area-inset-top)) 13px 0;pointer-events:none}.search-card{position:relative;border:1px solid #dddfe0;border-radius:25px;background:#fffffff2;box-shadow:0 12px 34px #1113;backdrop-filter:blur(18px);pointer-events:auto}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}.head strong{font-size:23px;letter-spacing:-.8px}.head small{display:block;margin-top:2px;color:#777b80;font-size:10px;font-weight:700;letter-spacing:.08em}.help{width:35px;height:35px;border:1px solid #e0e0e2;border-radius:50%;background:#f7f7f8;font-weight:850}.fields{position:relative;padding:0 12px 12px}.field{display:grid;grid-template-columns:18px minmax(0,1fr) 30px;align-items:center;gap:9px;min-height:48px;border:1px solid #e0e0e2;background:#f7f7f8}.field.origin{border-radius:17px 17px 7px 7px}.field.destination{margin-top:5px;border-radius:7px 7px 17px 17px}.field.active{border-color:#101113;box-shadow:0 0 0 1px #101113}.dot{width:10px;height:10px;margin:auto;border:2px solid #111;border-radius:50%;background:#fff}.destination .dot{border-radius:3px;background:#111}.field input{min-width:0;width:100%;height:46px;border:0;outline:0;background:transparent;color:#111;font-size:14px;font-weight:720}.field input::placeholder{color:#82858a;font-weight:620}.clear{width:28px;height:28px;border:0;background:transparent;color:#8b8e93;font-size:20px}.suggestions{position:absolute;z-index:3;left:12px;right:12px;top:118px;max-height:260px;overflow:auto;border:1px solid #dedfe1;border-radius:18px;background:#fff;box-shadow:0 15px 35px #1113}.suggestions[hidden]{display:none}.suggestion{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-bottom:1px solid #eee;background:#fff;color:#111;text-align:left}.suggestion:last-child{border-bottom:0}.suggestion:active{background:#f0f1f2}.suggestion-icon{width:38px;height:38px;border-radius:12px;background:#f0f1f2;display:grid;place-items:center;font-size:18px}.suggestion b,.suggestion small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.suggestion b{font-size:13px}.suggestion small{margin-top:3px;color:#777a80;font-size:10px}.tools{display:flex;gap:7px;padding:9px 13px 0;overflow:auto;pointer-events:auto;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool{flex:0 0 auto;min-height:40px;padding:0 13px;border:1px solid #d9dade;border-radius:14px;background:#fffffff0;color:#17181a;font-size:11px;font-weight:780;box-shadow:0 4px 14px #1111}.tool.active{background:#111;color:#fff;border-color:#111}.locate{width:42px;padding:0;font-size:18px}.message{display:none;margin:9px 13px 0;padding:11px 13px;border-radius:14px;background:#111;color:#fff;font-size:11px;font-weight:680;line-height:1.4;box-shadow:0 8px 22px #1113;pointer-events:auto}.message.show{display:block}.message.error{background:#a52727}.pin{width:27px;height:27px;border:3px solid #fff;border-radius:50% 50% 50% 0;background:#111;box-shadow:0 4px 12px #0005;transform:rotate(-45deg)}.pin.dest{background:#fff;border-color:#111}.pin span{display:block;width:7px;height:7px;margin:7px;border-radius:50%;background:#fff}.pin.dest span{background:#111}.leaflet-marker-icon.pin{margin:-25px 0 0 -13px!important}.leaflet-marker-icon.pin span{transform:rotate(45deg)}.sheet{position:absolute;z-index:510;left:11px;right:11px;bottom:89px;padding:13px 14px;border:1px solid #dddfe0;border-radius:23px;background:#fffffff5;box-shadow:0 13px 35px #1113;backdrop-filter:blur(18px);transform:translateY(150%);transition:.25s ease}.sheet.show{transform:translateY(0)}.sheet-top{display:flex;align-items:center;gap:11px}.line-badge{width:49px;height:49px;border-radius:15px;background:#111;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900}.sheet-copy{flex:1;min-width:0}.sheet-copy b{display:block;font-size:15px}.sheet-copy small{display:block;margin-top:4px;color:#72757b;font-size:10px}.duration{text-align:right;font-size:20px;font-weight:900}.steps{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid #e7e7e8;color:#52555a;font-size:10px;font-weight:750}.steps b{color:#111}.step-arrow{color:#a4a6aa}.nav{position:absolute;z-index:520;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);padding:8px 7px env(safe-area-inset-bottom);border-top:1px solid #dfe0e1;background:#fffffff2;backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:#686b70;font-size:10px;font-weight:740}.nav button span{display:block;margin:auto auto 4px;font-size:21px}.nav .active{color:#111}.nav .active span{width:40px;height:35px;padding-top:5px;border-radius:13px;background:#111;color:#fff}.map-tip{position:absolute;z-index:490;left:50%;top:52%;width:max-content;max-width:82%;padding:9px 12px;border-radius:13px;background:#111e;color:#fff;font-size:10px;font-weight:740;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:.2s}.map-tip.show{opacity:1}.loading{position:absolute;inset:0;z-index:700;background:#f4f5f2;display:grid;place-items:center;font-weight:850;letter-spacing:-.5px}.loading.hide{display:none}@media(max-width:360px){.head strong{font-size:20px}.tool{padding:0 10px}.sheet{bottom:82px}.steps{gap:5px}}
  </style>
</head>
<body>
  <main class="shell">
    <div id="map" class="map" aria-label="Amasya toplu taşıma rota haritası"></div>
    <div class="loading" id="loading">ElmaGo haritayı hazırlıyor…</div>
    <section class="route-ui" aria-label="Rota arama">
      <div class="search-card">
        <div class="head"><div><strong>Nasıl giderim?</strong><small>AKILLI TOPLU TAŞIMA</small></div><button class="help" type="button" aria-label="Yardım">?</button></div>
        <div class="fields">
          <label class="field origin" id="originField"><span class="dot"></span><input id="originInput" autocomplete="off" placeholder="Başlangıç konumu"><button class="clear" id="clearOrigin" type="button" aria-label="Başlangıcı temizle">×</button></label>
          <label class="field destination" id="destinationField"><span class="dot"></span><input id="destinationInput" autocomplete="off" placeholder="Nereye gitmek istiyorsun?"><button class="clear" id="clearDestination" type="button" aria-label="Varışı temizle">×</button></label>
          <div class="suggestions" id="suggestions" hidden></div>
        </div>
      </div>
      <div class="tools">
        <button class="tool active" id="pickOrigin" type="button">● Başlangıcı seç</button>
        <button class="tool" id="pickDestination" type="button">■ Varışı seç</button>
        <button class="tool locate" id="locate" type="button" aria-label="Konumumu kullan">⌖</button>
      </div>
      <div class="message" id="message"></div>
    </section>
    <div class="map-tip show" id="mapTip">Başlangıç noktasını haritadan seç</div>
    <section class="sheet" id="sheet" aria-live="polite">
      <div class="sheet-top"><div class="line-badge" id="lineBadge">1</div><div class="sheet-copy"><b id="routeTitle">En yakın uygun hat</b><small id="routeSubtitle"></small></div><div class="duration" id="duration">—</div></div>
      <div class="steps"><b id="walkStart">—</b><span>yürü</span><span class="step-arrow">›</span><b id="rideLine">Hat —</b><span class="step-arrow">›</span><b id="walkEnd">—</b><span>yürü</span></div>
    </section>
    <nav class="nav" aria-label="Ana menü"><button type="button"><span>☷</span>Ulaşım</button><button class="active" type="button"><span>⌖</span>Şehir</button><button type="button"><span>▦</span>QR</button><button type="button"><span>▣</span>İlanlar</button><button type="button"><span>♙</span>Hesap</button></nav>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (()=>{
    const AMASYA=[40.65,35.83],MAX_WALK=1000;
    const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(AMASYA,13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap katkıda bulunanlar'}).addTo(map);
    const ui={loading:document.getElementById('loading'),originInput:document.getElementById('originInput'),destinationInput:document.getElementById('destinationInput'),originField:document.getElementById('originField'),destinationField:document.getElementById('destinationField'),suggestions:document.getElementById('suggestions'),pickOrigin:document.getElementById('pickOrigin'),pickDestination:document.getElementById('pickDestination'),mapTip:document.getElementById('mapTip'),message:document.getElementById('message'),sheet:document.getElementById('sheet')};
    const state={mode:'origin',origin:null,destination:null,originMarker:null,destinationMarker:null,lines:[],routeLayers:[],timer:null,searchController:null};
    const localPlaces=[
      {name:'Amasya Otogarı',detail:'Dere Mahallesi, Amasya',lat:40.66848,lng:35.8372},
      {name:'Amasya Devlet Hastanesi',detail:'Pirinççi Mahallesi, Amasya',lat:40.6553,lng:35.8127},
      {name:'Amasya Üniversitesi',detail:'Akbilek Mahallesi, Amasya',lat:40.6494,lng:35.7909},
      {name:'Yavuz Selim Meydanı',detail:'Merkez, Amasya',lat:40.6505,lng:35.8332},
      {name:'Amasya Kalesi',detail:'Hatuniye Mahallesi, Amasya',lat:40.6577,lng:35.8278},
      {name:'Ferhat ile Şirin Müzesi',detail:'Helvacı Mahallesi, Amasya',lat:40.6419,lng:35.8080}
    ];
    const rad=x=>x*Math.PI/180;
    function distance(a,b){const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng),v=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;return 12742000*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}
    const point=value=>({lat:Number(value.lat??value[0]),lng:Number(value.lng??value[1])});
    const metres=value=>value<1000?Math.round(value/10)*10+' m':(value/1000).toFixed(1).replace('.',',')+' km';
    const minutes=value=>Math.max(1,Math.round(value/80));
    function showMessage(text,error=false){ui.message.textContent=text;ui.message.className='message show'+(error?' error':'');clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>ui.message.className='message',4200)}
    function setMode(mode){state.mode=mode;ui.pickOrigin.classList.toggle('active',mode==='origin');ui.pickDestination.classList.toggle('active',mode==='destination');ui.originField.classList.toggle('active',mode==='origin');ui.destinationField.classList.toggle('active',mode==='destination');ui.mapTip.textContent=mode==='origin'?'Başlangıç noktasını haritadan seç':'Varış noktasını haritadan seç';ui.mapTip.classList.add('show');setTimeout(()=>ui.mapTip.classList.remove('show'),2200)}
    function nearestForPoint(location,line){let best=null;(line.stops||[]).forEach((stop,index)=>{const p=point(stop),d=distance(location,p);if(!best||d<best.distance)best={point:p,distance:d,index,name:stop.name||('Durak '+(index+1))}});return best}
    function nearestAny(location){let best=null;state.lines.forEach(line=>{const hit=nearestForPoint(location,line);if(hit&&(!best||hit.distance<best.distance))best={...hit,line}});return best}
    function markerIcon(kind){return L.divIcon({className:'pin '+(kind==='destination'?'dest':''),html:'<span></span>',iconSize:[27,27],iconAnchor:[13,27]})}
    function clearRoutes(){state.routeLayers.forEach(layer=>map.removeLayer(layer));state.routeLayers=[];ui.sheet.classList.remove('show')}
    function updateMarker(kind,location,label){const key=kind+'Marker';if(state[key])map.removeLayer(state[key]);state[key]=L.marker([location.lat,location.lng],{icon:markerIcon(kind),zIndexOffset:1000}).addTo(map).bindTooltip(label,{direction:'top',offset:[0,-20]});state[kind]={...location,label};(kind==='origin'?ui.originInput:ui.destinationInput).value=label;clearRoutes();if(state.origin&&state.destination)buildRoute();else if(kind==='origin')setMode('destination')}
    function acceptLocation(kind,location,label){const nearest=nearestAny(location);if(!nearest||nearest.distance>MAX_WALK){showMessage('Bu noktaya '+Math.round(MAX_WALK/1000*10)/10+' km içinde toplu taşıma hattı yok. Başka bir nokta seç.',true);return false}updateMarker(kind,location,label);showMessage('Nokta kabul edildi · En yakın: Hat '+nearest.line.number+' · '+metres(nearest.distance));return true}
    function routeIndex(route,stop){let best={index:0,distance:Infinity};route.forEach((item,index)=>{const d=distance(stop,point(item));if(d<best.distance)best={index,distance:d}});return best.index}
    function bestCommonLine(){let best=null;state.lines.forEach(line=>{const a=nearestForPoint(state.origin,line),b=nearestForPoint(state.destination,line);if(!a||!b||a.distance>MAX_WALK||b.distance>MAX_WALK)return;const score=a.distance+b.distance;if(!best||score<best.score)best={line,a,b,score}});return best}
    function buildRoute(){clearRoutes();const best=bestCommonLine();if(!best){showMessage('Bu iki noktayı birbirine bağlayan yakın bir hat bulunamadı. Varış veya başlangıç noktasını değiştir.',true);return}const {line,a,b}=best,route=(line.route||[]).map(point);if(route.length<2){showMessage('Bu hattın güzergâh verisi hazır değil.',true);return}const i1=routeIndex(route,a.point),i2=routeIndex(route,b.point),segment=i1<=i2?route.slice(i1,i2+1):route.slice(i2,i1+1).reverse();const walk1=L.polyline([[state.origin.lat,state.origin.lng],[a.point.lat,a.point.lng]],{color:'#111',weight:4,dashArray:'2 9'}).addTo(map);const transit=L.polyline(segment.map(p=>[p.lat,p.lng]),{color:'#111',weight:7,opacity:.9,lineCap:'round'}).addTo(map);const walk2=L.polyline([[b.point.lat,b.point.lng],[state.destination.lat,state.destination.lng]],{color:'#111',weight:4,dashArray:'2 9'}).addTo(map);const s1=L.circleMarker([a.point.lat,a.point.lng],{radius:7,color:'#fff',weight:3,fillColor:'#111',fillOpacity:1}).addTo(map);const s2=L.circleMarker([b.point.lat,b.point.lng],{radius:7,color:'#fff',weight:3,fillColor:'#111',fillOpacity:1}).addTo(map);state.routeLayers=[walk1,transit,walk2,s1,s2];const bounds=L.latLngBounds([[state.origin.lat,state.origin.lng],[state.destination.lat,state.destination.lng],...segment.map(p=>[p.lat,p.lng])]);map.fitBounds(bounds,{paddingTopLeft:[25,190],paddingBottomRight:[25,190],maxZoom:15});const rideDistance=segment.slice(1).reduce((sum,p,i)=>sum+distance(segment[i],p),0),total=minutes(a.distance)+minutes(b.distance)+Math.max(3,Math.round(rideDistance/330));document.getElementById('lineBadge').textContent=line.number;document.getElementById('routeTitle').textContent='Hat '+line.number+' ile en uygun rota';document.getElementById('routeSubtitle').textContent=(line.frequency||'Yakındaki hat')+' · '+a.name+' → '+b.name;document.getElementById('duration').textContent=total+' dk';document.getElementById('walkStart').textContent=minutes(a.distance)+' dk';document.getElementById('rideLine').textContent='Hat '+line.number;document.getElementById('walkEnd').textContent=minutes(b.distance)+' dk';ui.sheet.classList.add('show')}
    function formatFeature(feature){const p=feature.properties||{},coords=feature.geometry?.coordinates||[];return{name:p.name||p.street||p.city||'Seçilen konum',detail:[p.district,p.city,p.state].filter(Boolean).join(', ')||'Amasya',lat:Number(coords[1]),lng:Number(coords[0])}}
    function renderSuggestions(items){ui.suggestions.replaceChildren();items.slice(0,6).forEach(item=>{const button=document.createElement('button');button.type='button';button.className='suggestion';button.innerHTML='<span class="suggestion-icon">⌖</span><span><b></b><small></small></span>';button.querySelector('b').textContent=item.name;button.querySelector('small').textContent=item.detail;button.onclick=()=>{ui.suggestions.hidden=true;acceptLocation(state.mode,{lat:item.lat,lng:item.lng},item.name);map.setView([item.lat,item.lng],15)};ui.suggestions.appendChild(button)});ui.suggestions.hidden=!items.length}
    async function search(query){const local=localPlaces.filter(item=>(item.name+' '+item.detail).toLocaleLowerCase('tr-TR').includes(query.toLocaleLowerCase('tr-TR')));if(query.length<2){renderSuggestions(local);return}state.searchController?.abort();state.searchController=new AbortController();try{const url='https://photon.komoot.io/api/?q='+encodeURIComponent(query+', Amasya')+'&lat=40.65&lon=35.83&limit=6&lang=tr';const response=await fetch(url,{signal:state.searchController.signal});const data=await response.json();const remote=(data.features||[]).map(formatFeature).filter(item=>Number.isFinite(item.lat)&&Number.isFinite(item.lng));const seen=new Set();renderSuggestions([...local,...remote].filter(item=>{const key=item.name+'|'+item.lat.toFixed(4);if(seen.has(key))return false;seen.add(key);return true}))}catch(error){if(error.name!=='AbortError')renderSuggestions(local)}}
    function bindInput(input,mode){input.addEventListener('focus',()=>{setMode(mode);search(input.value.trim())});input.addEventListener('input',()=>{setMode(mode);clearTimeout(state.timer);state.timer=setTimeout(()=>search(input.value.trim()),220)})}
    function clearPoint(kind){if(state[kind+'Marker'])map.removeLayer(state[kind+'Marker']);state[kind+'Marker']=null;state[kind]=null;(kind==='origin'?ui.originInput:ui.destinationInput).value='';clearRoutes();setMode(kind)}
    async function locate(){if(!navigator.geolocation){showMessage('Bu cihaz konum seçimini desteklemiyor.',true);return}showMessage('Konumun alınıyor…');navigator.geolocation.getCurrentPosition(pos=>{const location={lat:pos.coords.latitude,lng:pos.coords.longitude};if(acceptLocation('origin',location,'Mevcut konumum'))map.setView([location.lat,location.lng],15)},()=>showMessage('Konum izni alınamadı. Haritaya dokunarak seçebilirsin.',true),{enableHighAccuracy:true,timeout:9000,maximumAge:60000})}
    map.on('click',event=>{ui.suggestions.hidden=true;acceptLocation(state.mode,{lat:event.latlng.lat,lng:event.latlng.lng},state.mode==='origin'?'Haritadan seçilen başlangıç':'Haritadan seçilen varış')});
    ui.pickOrigin.onclick=()=>setMode('origin');ui.pickDestination.onclick=()=>setMode('destination');document.getElementById('locate').onclick=locate;document.getElementById('clearOrigin').onclick=()=>clearPoint('origin');document.getElementById('clearDestination').onclick=()=>clearPoint('destination');document.querySelector('.help').onclick=()=>showMessage('Arama kutusuna yazabilir veya Başlangıcı/Varışı seç düğmesine basıp haritaya dokunabilirsin. Hat olmayan noktalar kabul edilmez.');bindInput(ui.originInput,'origin');bindInput(ui.destinationInput,'destination');document.addEventListener('click',event=>{if(!event.target.closest('.search-card'))ui.suggestions.hidden=true});
    fetch('assets/amasya-transit-data.json?v=20260925-line6-last2235').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{state.lines=(data.lines||[]).filter(line=>line.id!=='11'&&Array.isArray(line.route)&&line.route.length>1&&Array.isArray(line.stops)&&line.stops.length);state.lines.forEach(line=>{line.number=line.number||line.id;line.stops=line.stops.map(stop=>({lat:Number(stop.lat??stop[0]),lng:Number(stop.lng??stop[1]),name:stop.name}))});ui.loading.classList.add('hide');showMessage(state.lines.length+' gerçek Amasya hattı hazır · Haritadan başlangıç seç')}).catch(()=>{ui.loading.textContent='Hat verileri yüklenemedi. Sayfayı yenile.'});
  })();
  </script>
</body>
</html>
