<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>elma</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input{font:inherit}.splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .55s ease,visibility .55s ease}.splash.hide{opacity:0;visibility:hidden}.splash-logo{font-size:74px;font-weight:700;letter-spacing:-5px;color:#bfc1c5;animation:elmaPulse 1.4s cubic-bezier(.4,0,.2,1) both}@keyframes elmaPulse{0%{opacity:0;transform:scale(.92) translateY(5px);filter:blur(3px)}35%{opacity:1;transform:scale(1.02);filter:blur(0)}100%{transform:scale(1.035);opacity:.9}}.login{position:fixed;inset:0;background:#000;z-index:900;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));overflow:auto;transition:.35s}.login.hide{opacity:0;visibility:hidden}.loginbox{width:100%;max-width:480px}.loginlogo{text-align:center;font-size:58px;font-weight:700;letter-spacing:-4px;color:#c7c9cd;margin-bottom:8px;animation:loginFloat 3s ease-in-out infinite}@keyframes loginFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.slogan{text-align:center!important;color:#a4a6ab!important;font-size:13px!important;letter-spacing:.2px;margin:0 0 27px!important}.login h1{text-align:left;font-size:27px;margin:0 0 7px}.login .desc{text-align:left;color:#85888e;margin:0 0 18px;font-size:14px}.phone{height:58px;background:#171717;border:1px solid #303030;border-radius:17px;display:flex;align-items:center;padding:0 16px;margin-bottom:10px}.country{font-weight:700;padding-right:12px;margin-right:12px;border-right:1px solid #353535}.phone input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.phone input::placeholder{color:#74777d}.continue{width:100%;height:56px;border:0;border-radius:17px;background:#e5e5e7;color:#080808;font-weight:800;font-size:16px}.divider{display:flex;align-items:center;gap:12px;color:#666;margin:20px 0 11px;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#242424;flex:1}.authbtn{width:100%;height:54px;border-radius:17px;margin:8px 0;border:1px solid #303030;background:#151515;color:#fff;font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;gap:12px}.authbtn.apple{background:#fff;color:#000}.authicon{font-size:20px;font-weight:800}.signup{text-align:center;color:#85888e;margin-top:20px;font-size:14px}.signup button{border:0;background:none;color:#fff;font-weight:750}.legal{text-align:center;color:#51545a;font-size:10px;line-height:1.45;margin:18px auto 0;max-width:330px}.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:40px;font-weight:700;letter-spacing:-3px;color:#c7c9cd}.profile{width:40px;height:40px;border-radius:50%;border:1px solid #333;background:#181818;color:#ddd}.hero{background:#141414;border:1px solid #292929;border-radius:26px;padding:18px}.hero h2{font-size:27px;margin:4px 0 16px}.field{display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #303030;border-radius:16px;padding:13px;margin:9px 0}.dot{width:10px;height:10px;border-radius:50%;background:#ddd;box-shadow:0 0 0 4px #333}.dot.live{background:#35d58a;box-shadow:0 0 0 4px #173a2a}.field small{display:block;color:#888;font-size:11px}.field input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:15px}.locstatus{font-size:11px;color:#8c8f95;margin-top:2px}.cta{width:100%;border:0;border-radius:16px;padding:15px;margin-top:8px;background:#d7d8da;color:#080808;font-weight:800}.mapwrap{height:300px;border-radius:26px;overflow:hidden;position:relative;border:1px solid #292929;margin-top:16px;background:#111}.mapviewport{position:absolute;inset:0;overflow:hidden}.mapviewport iframe{position:absolute;left:0;top:-48px;width:100%;height:calc(100% + 96px);border:0}.mapcover-top{position:absolute;left:0;right:0;top:0;height:20px;background:#111;z-index:2;pointer-events:none}.mapcover-bottom{position:absolute;left:0;right:0;bottom:0;height:34px;background:#111;z-index:2;pointer-events:none}.statusbox{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#231818;color:#ffb5b5;font-size:12px}.statusbox.show{display:block}</style></head><body><div id="splash" class="splash"><div class="splash-logo">elma</div></div><section id="login" class="login"><div class="loginbox"><div class="loginlogo">elma</div><p class="slogan">Şehir seninle hareket eder.</p><h1>Yolculuğa başla</h1><p class="desc">Telefon numaranla devam et veya başka bir giriş yöntemi seç.</p><div class="phone"><span class="country">🇹🇷 +90</span><input type="tel" inputmode="tel" placeholder="Telefon numarası" autocomplete="tel"></div><button class="continue" onclick="demoLogin()">Devam et</button><div class="divider">veya</div><button class="authbtn" onclick="demoLogin()"><span class="authicon">G</span>Google ile devam et</button><button class="authbtn apple" onclick="demoLogin()"><span class="authicon">●</span>Apple ile devam et</button><button class="authbtn" onclick="demoLogin()"><span class="authicon">✉</span>E-posta ile devam et</button><div class="signup">Elma'da yeni misin? <button onclick="demoLogin()">Üye ol</button></div><div class="legal">Devam ederek Elma'nın kullanım koşullarını ve gizlilik politikasını kabul etmiş olursun.</div></div></section><main class="app"><div class="top"><div class="logo">elma</div><button class="profile">●</button></div><div class="hero"><h2>Nereye gidiyorsun?</h2><button class="field" style="width:100%;text-align:left;color:white" onclick="requestLocation()"><div id="locDot" class="dot"></div><div><small>Nereden</small><div id="locValue">Konumum</div><div id="locStatus" class="locstatus">Canlı konumu kullanmak için dokun</div></div></button><div class="field"><div class="dot"></div><div style="flex:1"><small>Nereye</small><input placeholder="Durak veya yer ara"></div></div><button class="cta">Rota bul →</button><div id="errorBox" class="statusbox"></div></div><div class="mapwrap"><div class="mapviewport"><iframe id="mapFrame" title="Harita" src="https://www.google.com/maps?q=Amasya%20Merkez&z=14&output=embed"></iframe></div><div class="mapcover-top"></div><div class="mapcover-bottom"></div></div></main><script>window.addEventListener('load',()=>{setTimeout(()=>document.getElementById('splash').classList.add('hide'),1550)});function demoLogin(){document.getElementById('login').classList.add('hide')}let watchId=null;function requestLocation(){const s=document.getElementById('locStatus'),e=document.getElementById('errorBox');e.classList.remove('show');if(!window.isSecureContext){showError('Canlı konum yalnızca güvenli HTTPS bağlantısında çalışır.');return}if(!navigator.geolocation){showError('Bu tarayıcı konum özelliğini desteklemiyor.');return}s.textContent='Konum alınıyor…';navigator.geolocation.getCurrentPosition(firstLocation,locationError,{enableHighAccuracy:true,timeout:30000,maximumAge:0})}function firstLocation(p){updateLocation(p);if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(updateLocation,()=>{}, {enableHighAccuracy:true,timeout:30000,maximumAge:5000})}function updateLocation(p){const lat=p.coords.latitude,lng=p.coords.longitude,acc=Math.round(p.coords.accuracy);document.getElementById('locDot').classList.add('live');document.getElementById('locValue').textContent='Canlı konumum';document.getElementById('locStatus').textContent='Aktif • yaklaşık '+acc+' m doğruluk';document.getElementById('mapFrame').src='https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng)+'&z=17&output=embed'}function locationError(err){let m='Konum alınamadı.';if(err.code===1)m='Konum izni reddedildi.';if(err.code===2)m='iPhone konumu şu anda bulamıyor.';if(err.code===3)m='Konum alınması zaman aşımına uğradı.';document.getElementById('locStatus').textContent='Konum alınamadı';showError(m)}function showError(m){const e=document.getElementById('errorBox');e.textContent=m;e.classList.add('show')}</script></body></html>
