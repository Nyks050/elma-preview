<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060606"><title>elma</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:40px;font-weight:700;letter-spacing:-3px;color:#c7c9cd}.profile{width:40px;height:40px;border-radius:50%;border:1px solid #333;background:#181818;color:#ddd}.hero{background:#141414;border:1px solid #292929;border-radius:26px;padding:18px}.hero h2{font-size:27px;margin:4px 0 16px}.field{display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #303030;border-radius:16px;padding:13px;margin:9px 0}.dot{width:10px;height:10px;border-radius:50%;background:#ddd;box-shadow:0 0 0 4px #333}.dot.live{background:#35d58a;box-shadow:0 0 0 4px #173a2a}.field small{display:block;color:#888;font-size:11px}.field input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:15px}.locstatus{font-size:11px;color:#8c8f95;margin-top:2px}.cta{width:100%;border:0;border-radius:16px;padding:15px;margin-top:8px;background:#d7d8da;color:#080808;font-weight:800}.mapwrap{height:300px;border-radius:26px;overflow:hidden;position:relative;border:1px solid #292929;margin-top:16px;background:#111}.mapviewport{position:absolute;inset:0 0 30px 0;overflow:hidden}.mapviewport iframe{position:absolute;left:0;top:0;width:100%;height:calc(100% + 30px);border:0}.mapfab{position:absolute;right:14px;bottom:44px;width:46px;height:46px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#111;font-size:20px;z-index:3}.mapmask{position:absolute;left:0;right:0;bottom:0;height:30px;background:#111;z-index:2}.statusbox{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#231818;color:#ffb5b5;font-size:12px}.statusbox.show{display:block}</style></head><body><main class="app"><div class="top"><div class="logo">elma</div><button class="profile">●</button></div><div class="hero"><h2>Nereye gidiyorsun?</h2><button class="field" style="width:100%;text-align:left;color:white" onclick="requestLocation()"><div id="locDot" class="dot"></div><div><small>Nereden</small><div id="locValue">Konumum</div><div id="locStatus" class="locstatus">Canlı konumu kullanmak için dokun</div></div></button><div class="field"><div class="dot"></div><div style="flex:1"><small>Nereye</small><input placeholder="Durak veya yer ara"></div></div><button class="cta">Rota bul →</button><div id="errorBox" class="statusbox"></div></div><div class="mapwrap"><div class="mapviewport"><iframe id="mapFrame" title="Harita" src="https://www.google.com/maps?q=Amasya%20Merkez&z=14&output=embed"></iframe></div><button class="mapfab" aria-label="Konumuma git" onclick="requestLocation()">⌖</button><div class="mapmask"></div></div></main><script>let watchId=null;function requestLocation(){const s=document.getElementById('locStatus'),e=document.getElementById('errorBox');e.classList.remove('show');if(!window.isSecureContext){showError('Canlı konum yalnızca güvenli HTTPS bağlantısında çalışır.');return}if(!navigator.geolocation){showError('Bu tarayıcı konum özelliğini desteklemiyor.');return}s.textContent='Konum alınıyor…';navigator.geolocation.getCurrentPosition(firstLocation,locationError,{enableHighAccuracy:true,timeout:30000,maximumAge:0})}function firstLocation(p){updateLocation(p);if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(updateLocation,()=>{}, {enableHighAccuracy:true,timeout:30000,maximumAge:5000})}function updateLocation(p){const lat=p.coords.latitude,lng=p.coords.longitude,acc=Math.round(p.coords.accuracy);document.getElementById('locDot').classList.add('live');document.getElementById('locValue').textContent='Canlı konumum';document.getElementById('locStatus').textContent='Aktif • yaklaşık '+acc+' m doğruluk';document.getElementById('mapFrame').src='https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng)+'&z=17&output=embed'}function locationError(err){let m='Konum alınamadı.';if(err.code===1)m='Konum izni reddedildi.';if(err.code===2)m='iPhone konumu şu anda bulamıyor.';if(err.code===3)m='Konum alınması zaman aşımına uğradı.';document.getElementById('locStatus').textContent='Konum alınamadı';showError(m)}function showError(m){const e=document.getElementById('errorBox');e.textContent=m;e.classList.add('show')}</script></body></html>
