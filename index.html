<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>elma</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input{font:inherit}.splash,.login,.register,.verify{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;transition:.3s ease}.splash{z-index:999}.splash.hide,.login.hide{opacity:0;visibility:hidden}.login{z-index:900}.register,.verify{z-index:905;opacity:0;visibility:hidden}.register.show,.verify.show{opacity:1;visibility:visible}.box{width:100%;max-width:420px;margin:auto}.brand{text-align:center;font-weight:700;letter-spacing:-4px;color:#c7c9cd;font-size:54px;margin-bottom:28px}.splash .brand{font-size:74px;margin:0}.login .brand{font-size:58px}.login h1{text-align:center;font-size:27px;margin:0 0 7px}.desc{text-align:center;color:#85888e;margin:0 auto 20px;font-size:14px;line-height:1.4}.phone,.field{height:58px;background:#171717;border:1px solid #303030;border-radius:17px;display:flex;align-items:center;padding:0 16px;margin-bottom:10px}.country{font-weight:700;padding-right:12px;margin-right:12px;border-right:1px solid #353535}.phone input,.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.primary{width:100%;height:56px;border:0;border-radius:17px;background:#e5e5e7;color:#080808;font-weight:800}.msg{text-align:center;min-height:18px;margin:9px 0 0;color:#ff9d9d;font-size:12px}.divider{display:flex;align-items:center;gap:12px;color:#666;margin:14px 0 11px;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#242424;flex:1}.authbtn{width:100%;height:54px;border-radius:17px;margin:8px 0;border:1px solid #303030;background:#151515;color:#fff;font-weight:650}.authbtn.apple{background:#fff;color:#000}.signup,.back{text-align:center;color:#85888e;margin-top:20px;font-size:14px}.signup button,.back button{border:0;background:none;color:#fff;font-weight:750}.legal{text-align:center;color:#51545a;font-size:10px;line-height:1.45;margin:18px auto 0}.code{display:flex;justify-content:center;gap:9px;margin:22px 0}.code input{width:48px;height:58px;border-radius:15px;border:1px solid #333;background:#171717;color:#fff;text-align:center;font-size:24px;font-weight:700}.verifyphone{text-align:center;color:#d1d2d5;font-weight:650}.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:40px;font-weight:700;letter-spacing:-3px;color:#c7c9cd}.profile{width:40px;height:40px;border-radius:50%;border:1px solid #333;background:#181818;color:#ddd}.hero{background:#141414;border:1px solid #292929;border-radius:26px;padding:18px}.hero h2{font-size:27px;margin:4px 0 14px;letter-spacing:-.7px}.transport{display:flex;gap:10px;margin:0 0 15px}.mode{height:60px;border-radius:18px;border:1px solid #343434;background:#1b1b1b;color:#fff;padding:0 18px;display:flex;align-items:center;gap:11px;font-weight:800}.mode.active{background:#f0f0f2;color:#090909;border-color:#f0f0f2}.mode.disabled{opacity:.42}.mode svg{width:35px;height:35px;display:block}.mode span{font-size:16px}.mode small{font-size:9px;font-weight:700;opacity:.52}.routefield{width:100%;display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #303030;border-radius:16px;padding:12px 13px;margin:9px 0;color:#fff;text-align:left}.dot{width:10px;height:10px;border-radius:50%;background:#ddd;box-shadow:0 0 0 4px #333;flex:0 0 auto}.dot.live{background:#35d58a}.routefield small{display:block;color:#888;font-size:11px;margin-bottom:2px}.routefield input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.locbtn{width:38px;height:38px;border-radius:12px;border:1px solid #373737;background:#171717;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:18px}.origin-wrap{position:relative;z-index:80}.dest-wrap{position:relative;z-index:40}.origin-wrap .suggestions{z-index:3000}.dest-wrap .suggestions{z-index:2000}.suggestions{display:none;position:absolute;left:0;right:0;top:calc(100% - 2px);background:#171717;border:1px solid #383838;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.72);max-height:290px;overflow-y:auto}.suggestions.show{display:block}.suggestion{width:100%;border:0;border-bottom:1px solid #282828;background:#171717;color:#fff;text-align:left;padding:13px;display:flex;gap:10px;align-items:center}.suggestion:last-child{border-bottom:0}.pin{width:30px;height:30px;border-radius:50%;background:#252525;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.s-main{font-size:14px;font-weight:750}.s-sub{font-size:10px;color:#85888e;margin-top:2px}.cta{width:100%;border:0;border-radius:16px;padding:15px;margin-top:8px;background:#d7d8da;color:#090909;font-weight:800}.mapwrap{height:350px;border-radius:26px;overflow:hidden;position:relative;border:1px solid #292929;margin-top:16px;background:#111}.mapwrap #map{position:absolute;inset:0}.leaflet-control-attribution{background:rgba(10,10,10,.75)!important;color:#777!important;font-size:8px!important}.leaflet-control-attribution a{color:#aaa!important}.leaflet-control-zoom a{background:#181818!important;color:#ddd!important;border-color:#333!important}.recaptcha{position:absolute;left:-9999px;top:-9999px}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="brand">elma</div></div>
<section id="login" class="login"><div class="box"><div class="brand">elma</div><h1>Nereye istersen.</h1><p class="desc">Telefon numaranla devam et veya başka bir giriş yöntemi seç.</p><div class="phone"><span class="country">🇹🇷 +90</span><input id="phoneInput" type="tel" placeholder="5XX XXX XX XX"></div><button id="phoneBtn" class="primary">Devam et</button><div id="phoneMsg" class="msg"></div><div id="recaptcha-container" class="recaptcha"></div><div class="divider">veya</div><button class="authbtn" onclick="googleLogin()">Google ile devam et</button><button class="authbtn apple" onclick="demoLogin()">Apple ile devam et</button><button class="authbtn" onclick="demoLogin()">E-posta ile devam et</button><div class="signup">Elma'da yeni misin? <button onclick="openRegister()">Üye ol</button></div><div class="legal">Devam ederek Elma'nın kullanım koşullarını ve gizlilik politikasını kabul etmiş olursun.</div></div></section>
<section id="verify" class="verify"><div class="box"><div class="brand">elma</div><h1>Kodu gir</h1><div id="verifyPhone" class="verifyphone"></div><div class="code" id="codeBox"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div><button id="verifyBtn" class="primary">Doğrula ve devam et</button><div id="codeMsg" class="msg"></div><div class="back"><button onclick="backToLogin()">← Geri</button></div></div></section>
<section id="register" class="register"><div class="box"><div class="brand">elma</div><h1>Hesabını oluştur</h1><div class="field"><input placeholder="Ad soyad"></div><div class="field"><input placeholder="Telefon numarası"></div><div class="field"><input placeholder="E-posta adresi"></div><button class="primary" onclick="finishRegister()">Hesap oluştur</button><div class="back"><button onclick="closeRegister()">Giriş yap</button></div></div></section>
<main class="app"><div class="top"><div class="logo">elma</div><button class="profile">●</button></div><div class="hero"><h2>Nereye gidiyorsun?</h2><div class="transport"><button class="mode active"><svg viewBox="0 0 32 32"><path fill="currentColor" d="M7 4h18a4 4 0 0 1 4 4v15a3 3 0 0 1-3 3h-1v2.2h-4V26H11v2.2H7V26a3 3 0 0 1-3-3V8a4 4 0 0 1 3-4Zm2 4v8h14V8H9Zm1 11.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg><span>Otobüs</span></button><button class="mode disabled" disabled><svg viewBox="0 0 32 32"><path fill="currentColor" d="M10 6h12l2 5 3 2v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V13l3-2 2-5Zm2 3-1 3h10l-1-3h-8ZM9 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm14 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg><span>Taksi <small>Yakında</small></span></button></div>
<div class="origin-wrap"><div class="routefield"><div id="locDot" class="dot"></div><div style="flex:1"><small>Nereden</small><input id="originInput" placeholder="Konumunu yaz" autocomplete="off"></div><button class="locbtn" type="button" onclick="requestLocation()" aria-label="Canlı konum">⌖</button></div><div id="originSuggestions" class="suggestions"></div></div>
<div class="dest-wrap"><div class="routefield"><div class="dot"></div><div style="flex:1"><small>Nereye</small><input id="destinationInput" placeholder="Bir yer ara" autocomplete="off"></div></div><div id="suggestions" class="suggestions"></div></div>
<button class="cta" onclick="showRoute()">Rota bul →</button></div><div class="mapwrap"><div id="map"></div></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyBWic36WVTPG5oWUtSCJ-6MWrKWbO_w9aQ",authDomain:"elma-bd38c.firebaseapp.com",projectId:"elma-bd38c",storageBucket:"elma-bd38c.firebasestorage.app",messagingSenderId:"675060354080",appId:"1:675060354080:web:cef2e0c3145440e2d40045"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);let confirmationResult=null,recaptchaVerifier=null;
window.addEventListener('load',()=>setTimeout(()=>$('splash').classList.add('hide'),1200));
function setupRecaptcha(){if(!recaptchaVerifier)recaptchaVerifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'invisible'})}
async function startPhoneLogin(){const n=$('phoneInput').value.replace(/\D/g,'');if(n.length<10){$('phoneMsg').textContent='Geçerli numara gir.';return}try{setupRecaptcha();confirmationResult=await signInWithPhoneNumber(auth,'+90'+n.slice(-10),recaptchaVerifier);$('verifyPhone').textContent='+90 '+n.slice(-10);$('verify').classList.add('show')}catch(e){$('phoneMsg').textContent='SMS şu an kullanılamıyor.'}}
async function googleLogin(){const provider=new GoogleAuthProvider();try{await signOut(auth);await signInWithPopup(auth,provider);$('login').classList.add('hide')}catch(e){try{await signInWithRedirect(auth,provider)}catch(_){}}}
async function verifyCode(){const code=[...document.querySelectorAll('#codeBox input')].map(x=>x.value).join('');try{await confirmationResult.confirm(code);$('verify').classList.remove('show');$('login').classList.add('hide')}catch(e){$('codeMsg').textContent='Kod doğrulanamadı.'}}
function demoLogin(){$('login').classList.add('hide')}function openRegister(){$('register').classList.add('show')}function closeRegister(){$('register').classList.remove('show')}function finishRegister(){$('register').classList.remove('show');$('login').classList.add('hide')}function backToLogin(){$('verify').classList.remove('show')}
$('phoneBtn').onclick=startPhoneLogin;$('verifyBtn').onclick=verifyCode;onAuthStateChanged(auth,u=>{if(u)$('login').classList.add('hide')});getRedirectResult(auth).catch(()=>{});Object.assign(window,{googleLogin,demoLogin,openRegister,closeRegister,finishRegister,backToLogin});

const map=L.map('map',{zoomControl:false}).setView([40.65,35.83],14);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
let currentLat=null,currentLng=null,originPoint=null,destinationPoint=null,locationMarker=null,originMarker=null,destinationMarker=null,routeMain=null,routeEdge=null,watchId=null,searchTimer=null;
const userIcon=L.divIcon({className:'',html:'<div style="width:14px;height:14px;background:#fff;border:3px solid #111;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.25)"></div>',iconSize:[14,14],iconAnchor:[7,7]});
const pointIcon=L.divIcon({className:'',html:'<div style="width:16px;height:16px;background:#090909;border:3px solid #eee;border-radius:50%;box-shadow:0 3px 12px #000"></div>',iconSize:[16,16],iconAnchor:[8,8]});
function requestLocation(){if(!navigator.geolocation)return;$('originInput').value='Konum alınıyor…';navigator.geolocation.getCurrentPosition(p=>{setLocation(p,true);if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>setLocation(p,false),()=>{},{enableHighAccuracy:false,maximumAge:30000,timeout:20000})},()=>{$('originInput').value='';$('originInput').placeholder='Konum alınamadı, elle yaz'},{enableHighAccuracy:true,maximumAge:30000,timeout:15000})}
function setLocation(p,center){currentLat=p.coords.latitude;currentLng=p.coords.longitude;originPoint={lat:currentLat,lng:currentLng,name:'Canlı konumum'};$('locDot').classList.add('live');$('originInput').value='Canlı konumum';if(locationMarker)locationMarker.setLatLng([currentLat,currentLng]);else locationMarker=L.marker([currentLat,currentLng],{icon:userIcon}).addTo(map);if(center)map.setView([currentLat,currentLng],16)}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function searchPlaces(q){const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=tr&limit=8&q='+encodeURIComponent(q);const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('search');return await r.json()}
function bindSearch(inputId,boxId,isOrigin){const input=$(inputId),box=$(boxId);input.addEventListener('input',()=>{if(isOrigin){originPoint=null;$('locDot').classList.remove('live')}else destinationPoint=null;clearTimeout(searchTimer);const q=input.value.trim();if(q.length<2){box.classList.remove('show');return}searchTimer=setTimeout(()=>showSuggestions(q,box,input,isOrigin),320)});input.addEventListener('focus',()=>{const q=input.value.trim();if(q.length>=2&&q!=='Canlı konumum')showSuggestions(q,box,input,isOrigin)});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();box.classList.remove('show');if(!isOrigin)showRoute()}})}
async function showSuggestions(q,box,input,isOrigin){try{const items=await searchPlaces(q);box.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='suggestion';const title=(x.name||x.display_name.split(',')[0]||q),sub=x.display_name||'';b.innerHTML='<span class="pin">⌖</span><span><div class="s-main">'+escapeHtml(title)+'</div><div class="s-sub">'+escapeHtml(sub)+'</div></span>';b.onclick=()=>{const p={lat:Number(x.lat),lng:Number(x.lon),name:title};input.value=title;box.classList.remove('show');if(isOrigin){originPoint=p;showOrigin(p)}else{destinationPoint=p;showDestination(p)}};box.appendChild(b)});box.classList.toggle('show',items.length>0)}catch(e){console.error(e);box.classList.remove('show')}}
async function geocode(name){const items=await searchPlaces(name);if(!items[0])throw new Error('notfound');return{lat:Number(items[0].lat),lng:Number(items[0].lon),name:items[0].name||name}}
function showOrigin(p){if(originMarker)originMarker.setLatLng([p.lat,p.lng]);else originMarker=L.marker([p.lat,p.lng],{icon:pointIcon}).addTo(map);map.setView([p.lat,p.lng],16)}
function showDestination(p){if(destinationMarker)destinationMarker.setLatLng([p.lat,p.lng]);else destinationMarker=L.marker([p.lat,p.lng],{icon:pointIcon}).addTo(map);map.setView([p.lat,p.lng],16)}
bindSearch('originInput','originSuggestions',true);bindSearch('destinationInput','suggestions',false);
document.addEventListener('click',e=>{if(!e.target.closest('.origin-wrap'))$('originSuggestions').classList.remove('show');if(!e.target.closest('.dest-wrap'))$('suggestions').classList.remove('show')});
async function showRoute(){const rawOrigin=$('originInput').value.trim(),rawDest=$('destinationInput').value.trim();if(!rawDest){$('destinationInput').focus();return}try{if(!destinationPoint)destinationPoint=await geocode(rawDest);if(!originPoint){if(rawOrigin&&rawOrigin!=='Canlı konumum'&&rawOrigin!=='Konum alınıyor…')originPoint=await geocode(rawOrigin);else if(currentLat!=null)originPoint={lat:currentLat,lng:currentLng,name:'Canlı konumum'};else{requestLocation();return}}showOrigin(originPoint);showDestination(destinationPoint);const url='https://router.project-osrm.org/route/v1/driving/'+originPoint.lng+','+originPoint.lat+';'+destinationPoint.lng+','+destinationPoint.lat+'?overview=full&geometries=geojson';const r=await fetch(url);const d=await r.json();if(!d.routes||!d.routes[0])throw new Error('route');const latlngs=d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);if(routeEdge)map.removeLayer(routeEdge);if(routeMain)map.removeLayer(routeMain);routeEdge=L.polyline(latlngs,{color:'#000',weight:11,opacity:.8,lineCap:'round',lineJoin:'round'}).addTo(map);routeMain=L.polyline(latlngs,{color:'#f5f5f5',weight:6,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(map);map.fitBounds(routeMain.getBounds(),{padding:[35,35]});setTimeout(()=>map.invalidateSize(),50)}catch(e){console.error(e);alert('Rota bulunamadı. Başlangıç ve hedefi listeden seçip tekrar dene.')}}
Object.assign(window,{requestLocation,showRoute});
</script>
</body>
</html>
