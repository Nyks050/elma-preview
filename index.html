<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Elma Go</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input{font:inherit}:root{--silver:#d5d7da;--soft:#8d9095}.splash,.login,.register,.verify,.kvkk{position:fixed;inset:0;background:radial-gradient(circle at 50% 46%,#111 0,#050505 38%,#000 72%);display:flex;align-items:center;justify-content:center;padding:calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;transition:.35s}.splash{z-index:999}.splash.hide,.login.hide{opacity:0;visibility:hidden}.login{z-index:900}.register,.verify,.kvkk{z-index:905;opacity:0;visibility:hidden}.register.show,.verify.show,.kvkk.show{opacity:1;visibility:visible}.kvkk{z-index:920}.box{width:100%;max-width:420px;margin:auto}.wordmark{display:inline-flex;align-items:flex-end;justify-content:center;color:var(--silver);font-weight:760;letter-spacing:-4px;line-height:.84;white-space:nowrap}.wordmark .elma{font-size:1em}.wordmark .go{position:relative;font-size:.82em;font-weight:620;letter-spacing:-3px;margin-left:.14em}.brand{text-align:center;margin-bottom:28px;font-size:54px}.splash .brand{font-size:78px;margin:0}.login .brand{font-size:60px}.logo{font-size:38px}.login h1,.register h1,.verify h1,.kvkk h1{text-align:center;font-size:27px;margin:0 0 12px}.desc{text-align:center;color:var(--soft);font-size:14px}.phone,.field{height:58px;background:#151515;border:1px solid #303033;border-radius:18px;display:flex;align-items:center;padding:0 16px;margin-bottom:10px}.country{font-weight:700;padding-right:12px;margin-right:12px;border-right:1px solid #353535}.phone input,.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff}.primary{width:100%;height:56px;border:1px solid #e7e8ea;border-radius:18px;background:#ddd;color:#070707;font-weight:850}.primary:disabled{opacity:.35}.msg{text-align:center;min-height:18px;margin:9px}.divider{display:flex;align-items:center;gap:12px;color:#666;margin:14px 0}.authbtn{width:100%;height:54px;border-radius:18px;margin:8px 0;border:1px solid #303033;background:#151515;color:#fff;font-weight:680}.authbtn.apple{background:#eee;color:#050505}.signup,.back{text-align:center;color:#85888e;margin-top:20px}.signup button,.back button{border:0;background:none;color:#fff}.kvkk-row{display:flex;align-items:center;gap:9px;margin:4px 2px 14px}.kvkk-text{height:55vh;overflow-y:auto}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.profile{width:42px;height:42px;border-radius:50%;border:1px solid #343436;background:#171717;color:#ddd}.hero{position:relative;background:linear-gradient(145deg,#151516,#0b0b0c);border:1px solid #343438;border-radius:32px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}.hero h2{text-align:center;margin:0 0 20px;font-size:25px;letter-spacing:-.6px}.transport{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.mode{min-height:116px;border-radius:24px;border:1px solid #36363a;background:#171719;color:#f2f2f2;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:780}.mode.active{background:linear-gradient(180deg,#f0f0f1,#cfd0d2);color:#080808;border-color:#f0f0f1}.mode svg{width:68px;height:68px;display:block;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.mode:disabled{opacity:.58}.routefield{display:flex;align-items:center;gap:12px;background:#171719;border:1px solid #333338;border-radius:20px;padding:13px 14px;margin:10px 0;min-height:62px}.dot{width:10px;height:10px;border-radius:50%;background:#d7d9dc}.routefield small{display:block;color:#8f9297;font-size:11px}.routefield input{width:100%;border:0;outline:0;background:transparent;color:#fff}.locbtn{width:40px;height:40px;border-radius:13px;border:1px solid #3a3a3d;background:#0d0d0e;color:#fff}.cta{width:100%;border:0;border-radius:20px;padding:17px;background:linear-gradient(180deg,#eee,#cfd0d2);font-weight:850;margin-top:5px}.mapwrap{height:350px;border-radius:28px;overflow:hidden;position:relative;border:1px solid #303033;margin-top:16px}.mapwrap #map{position:absolute;inset:0}.recaptcha{position:absolute;left:-9999px}</style></head><body><div id="splash" class="splash"><div class="brand wordmark"><span class="elma">elma</span><span class="go">go</span></div></div><section id="login" class="login"><div class="box"><div class="brand wordmark"><span class="elma">elma</span><span class="go">go</span></div><h1>Nereye istersen.</h1><p class="desc">Telefon numaranla devam et veya başka bir giriş yöntemi seç.</p><div class="phone"><span class="country">🇹🇷 +90</span><input id="phoneInput" type="tel" placeholder="5XX XXX XX XX"></div><button id="phoneBtn" class="primary">Devam et</button><div id="phoneMsg" class="msg"></div><div id="recaptcha-container" class="recaptcha"></div><div class="divider">veya</div><button class="authbtn" onclick="googleLogin()">Google ile devam et</button><button class="authbtn apple" onclick="demoLogin()">Apple ile devam et</button><button class="authbtn" onclick="demoLogin()">✉ E-posta ile devam et</button><div class="signup">Elma Go'da yeni misin? <button onclick="openRegister()">Üye ol</button></div></div></section><section id="register" class="register"><div class="box"><h1>Hesabını oluştur</h1><div class="field"><input placeholder="Ad soyad"></div><div class="field"><input placeholder="Telefon numarası"></div><div class="field"><input placeholder="E-posta adresi"></div><button class="primary" onclick="finishRegister()">Hesap oluştur</button></div></section><main class="app"><div class="top"><div class="logo wordmark"><span class="elma">elma</span><span class="go">go</span></div><button class="profile">●</button></div><div class="hero"><h2>Nereye gidiyorsun?</h2><div class="transport"><button class="mode active"><svg viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="21" rx="4"/><path d="M10 9h12M10 14h12M9 20h14M10 25v3M22 25v3"/><circle cx="11" cy="21" r="1.4"/><circle cx="21" cy="21" r="1.4"/></svg><span>Otobüs</span></button><button class="mode" disabled><svg viewBox="0 0 32 32"><path d="M5 19l2.5-7.2A4 4 0 0 1 11.3 9h9.4a4 4 0 0 1 3.8 2.8L27 19v6H5z"/><path d="M8 18h16M10 14h12M8 25v3M24 25v3"/><circle cx="10" cy="22" r="1.6"/><circle cx="22" cy="22" r="1.6"/></svg><span>Taksi · Yakında</span></button></div><div class="routefield"><div class="dot"></div><div style="flex:1"><small>Nereden</small><input id="originInput" placeholder="Konumunu yaz"></div><button class="locbtn" onclick="requestLocation()">⌖</button></div><div class="routefield"><div class="dot"></div><div style="flex:1"><small>Nereye</small><input id="destinationInput" placeholder="Bir yer ara"></div></div><button class="cta" onclick="showRoute()">Rota bul →</button></div><div class="mapwrap"><div id="map"></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyBWic36WVTPG5oWUtSCJ-6MWrKWbO_w9aQ",authDomain:"elma-bd38c.firebaseapp.com",projectId:"elma-bd38c",storageBucket:"elma-bd38c.firebasestorage.app",messagingSenderId:"675060354080",appId:"1:675060354080:web:cef2e0c3145440e2d40045"};const app=initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);let recaptchaVerifier=null;window.addEventListener('load',()=>setTimeout(()=>$('splash').classList.add('hide'),1200));async function startPhoneLogin(){const n=$('phoneInput').value.replace(/\D/g,'');if(n.length<10)return;if(!recaptchaVerifier)recaptchaVerifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'invisible'});const c=await signInWithPhoneNumber(auth,'+90'+n.slice(-10),recaptchaVerifier);$('login').classList.add('hide')}async function googleLogin(){const p=new GoogleAuthProvider();try{await signOut(auth);await signInWithPopup(auth,p);$('login').classList.add('hide')}catch(e){await signInWithRedirect(auth,p)}}function demoLogin(){$('login').classList.add('hide')}function openRegister(){$('register').classList.add('show')}function finishRegister(){$('register').classList.remove('show');$('login').classList.add('hide')}const map=L.map('map',{zoomControl:false}).setView([40.65,35.83],14);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20}).addTo(map);function requestLocation(){navigator.geolocation?.getCurrentPosition(p=>{originInput.value='Canlı konumum';map.setView([p.coords.latitude,p.coords.longitude],16)})}async function search(q){return await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=tr&limit=8&q='+encodeURIComponent(q))).json()}async function showRoute(){const a=await search(originInput.value),b=await search(destinationInput.value);if(!a[0]||!b[0])return alert('Konum bulunamadı');const d=await(await fetch('https://router.project-osrm.org/route/v1/driving/'+a[0].lon+','+a[0].lat+';'+b[0].lon+','+b[0].lat+'?overview=full&geometries=geojson')).json();if(!d.routes?.[0])return alert('Rota bulunamadı');const ll=d.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);L.polyline(ll,{weight:6}).addTo(map);map.fitBounds(ll)}$('phoneBtn').onclick=startPhoneLogin;onAuthStateChanged(auth,u=>{if(u)$('login').classList.add('hide')});getRedirectResult(auth).catch(()=>{});Object.assign(window,{googleLogin,demoLogin,openRegister,finishRegister,requestLocation,showRoute});</script></body></html>
