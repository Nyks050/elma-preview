<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>elma</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}button,input{font:inherit}.splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .55s ease,visibility .55s ease}.splash.hide{opacity:0;visibility:hidden}.splash-logo{font-size:74px;font-weight:700;letter-spacing:-5px;color:#bfc1c5;animation:elmaPulse 1.4s cubic-bezier(.4,0,.2,1) both}@keyframes elmaPulse{0%{opacity:0;transform:scale(.92) translateY(5px);filter:blur(3px)}35%{opacity:1;transform:scale(1.02);filter:blur(0)}100%{transform:scale(1.035);opacity:.9}}.login{position:fixed;inset:0;background:#000;z-index:900;display:flex;align-items:center;justify-content:center;padding:calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto;transition:.35s}.login.hide{opacity:0;visibility:hidden}.loginbox{width:100%;max-width:420px;margin:auto}.loginlogo{text-align:center;font-size:58px;font-weight:700;letter-spacing:-4px;color:#c7c9cd;margin-bottom:7px;animation:loginFloat 3s ease-in-out infinite}@keyframes loginFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.slogan{text-align:center;color:#9b9ea4;font-size:13px;letter-spacing:.2px;margin:0 0 30px}.login h1{text-align:center;font-size:27px;margin:0 0 7px}.login .desc{text-align:center;color:#85888e;margin:0 auto 20px;font-size:14px;line-height:1.4;max-width:330px}.phone{height:58px;background:#171717;border:1px solid #303030;border-radius:17px;display:flex;align-items:center;padding:0 16px;margin-bottom:10px}.country{font-weight:700;padding-right:12px;margin-right:12px;border-right:1px solid #353535}.phone input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.phone input::placeholder{color:#74777d}.continue{width:100%;height:56px;border:0;border-radius:17px;background:#e5e5e7;color:#080808;font-weight:800;font-size:16px}.divider{display:flex;align-items:center;gap:12px;color:#666;margin:19px 0 11px;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#242424;flex:1}.authbtn{position:relative;width:100%;height:54px;border-radius:17px;margin:8px 0;border:1px solid #303030;background:#151515;color:#fff;font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center}.authbtn.apple{background:#fff;color:#000}.brandicon{position:absolute;left:18px;width:23px;height:23px;display:flex;align-items:center;justify-content:center}.brandicon svg{display:block;width:22px;height:22px}.mailicon{font-size:19px}.signup{text-align:center;color:#85888e;margin-top:20px;font-size:14px}.signup button{border:0;background:none;color:#fff;font-weight:750}.legal{text-align:center;color:#51545a;font-size:10px;line-height:1.45;margin:18px auto 0;max-width:330px}.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:40px;font-weight:700;letter-spacing:-3px;color:#c7c9cd}.profile{width:40px;height:40px;border-radius:50%;border:1px solid #333;background:#181818;color:#ddd}.hero{background:#141414;border:1px solid #292929;border-radius:26px;padding:18px}.hero h2{font-size:27px;margin:4px 0 16px}.field{display:flex;align-items:center;gap:12px;background:#202020;border:1px solid #303030;border-radius:16px;padding:13px;margin:9px 0}.dot{width:10px;height:10px;border-radius:50%;background:#ddd;box-shadow:0 0 0 4px #333}.dot.live{background:#35d58a;box-shadow:0 0 0 4px #173a2a}.field small{display:block;color:#888;font-size:11px}.field input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:15px}.locstatus{font-size:11px;color:#8c8f95;margin-top:2px}.cta{width:100%;border:0;border-radius:16px;padding:15px;margin-top:8px;background:#d7d8da;color:#080808;font-weight:800}.mapwrap{height:300px;border-radius:26px;overflow:hidden;position:relative;border:1px solid #292929;margin-top:16px;background:#111}.mapviewport{position:absolute;inset:0;overflow:hidden}.mapviewport iframe{position:absolute;left:0;top:-48px;width:100%;height:calc(100% + 96px);border:0}.mapcover-top{position:absolute;left:0;right:0;top:0;height:20px;background:#111;z-index:2;pointer-events:none}.mapcover-bottom{position:absolute;left:0;right:0;bottom:0;height:34px;background:#111;z-index:2;pointer-events:none}.statusbox{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#231818;color:#ffb5b5;font-size:12px}.statusbox.show{display:block}</style></head><body><div id="splash" class="splash"><div class="splash-logo">elma</div></div><section id="login" class="login"><div class="loginbox"><div class="loginlogo">elma</div><p class="slogan">Şehir seninle hareket eder.</p><h1>Yolculuğa başla</h1><p class="desc">Telefon numaranla devam et veya başka bir giriş yöntemi seç.</p><div class="phone"><span class="country">🇹🇷 +90</span><input type="tel" inputmode="tel" placeholder="Telefon numarası" autocomplete="tel"></div><button class="continue" onclick="demoLogin()">Devam et</button><div class="divider">veya</div><button class="authbtn" onclick="demoLogin()"><span class="brandicon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.43l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.06v2.62A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.41 13.87A6 6 0 0 1 6.1 12c0-.65.11-1.28.31-1.87V7.51H3.06A10 10 0 0 0 2 12c0 1.61.38 3.14 1.06 4.49l3.35-2.62z"/><path fill="#EA4335" d="M12 6.01c1.47 0 2.78.5 3.82 1.5l2.86-2.86A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.94 5.51l3.35 2.62C7.2 7.77 9.4 6.01 12 6.01z"/></svg></span>Google ile devam et</button><button class="authbtn apple" onclick="demoLogin()"><span class="brandicon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.05 12.54c-.02-2.14 1.75-3.18 1.83-3.23a3.93 3.93 0 0 0-3.1-1.68c-1.3-.14-2.56.78-3.22.78-.67 0-1.68-.76-2.77-.74a4.08 4.08 0 0 0-3.43 2.09c-1.48 2.56-.38 6.33 1.04 8.4.71 1.02 1.54 2.15 2.63 2.11 1.06-.04 1.46-.68 2.74-.68 1.27 0 1.65.68 2.76.66 1.14-.02 1.86-1.02 2.54-2.05a8.35 8.35 0 0 0 1.16-2.37 3.69 3.69 0 0 1-2.18-3.29zM14.93 6.25a3.72 3.72 0 0 0 .85-2.67 3.79 3.79 0 0 0-2.46 1.27 3.55 3.55 0 0 0-.88 2.57 3.13 3.13 0 0 0 2.49-1.17z"/></svg></span>Apple ile devam et</button><button class="authbtn" onclick="demoLogin()"><span class="brandicon mailicon">✉</span>E-posta ile devam et</button><div class="signup">Elma'da yeni misin? <button onclick="demoLogin()">Üye ol</button></div><div class="legal">Devam ederek Elma'nın kullanım koşullarını ve gizlilik politikasını kabul etmiş olursun.</div></div></section><main class="app"><div class="top"><div class="logo">elma</div><button class="profile">●</button></div><div class="hero"><h2>Nereye gidiyorsun?</h2><button class="field" style="width:100%;text-align:left;color:white" onclick="requestLocation()"><div id="locDot" class="dot"></div><div><small>Nereden</small><div id="locValue">Konumum</div><div id="locStatus" class="locstatus">Canlı konumu kullanmak için dokun</div></div></button><div class="field"><div class="dot"></div><div style="flex:1"><small>Nereye</small><input placeholder="Durak veya yer ara"></div></div><button class="cta">Rota bul →</button><div id="errorBox" class="statusbox"></div></div><div class="mapwrap"><div class="mapviewport"><iframe id="mapFrame" title="Harita" src="https://www.google.com/maps?q=Amasya%20Merkez&z=14&output=embed"></iframe></div><div class="mapcover-top"></div><div class="mapcover-bottom"></div></div></main><script>window.addEventListener('load',()=>{setTimeout(()=>document.getElementById('splash').classList.add('hide'),1550)});function demoLogin(){document.getElementById('login').classList.add('hide')}let watchId=null;function requestLocation(){const s=document.getElementById('locStatus'),e=document.getElementById('errorBox');e.classList.remove('show');if(!window.isSecureContext){showError('Canlı konum yalnızca güvenli HTTPS bağlantısında çalışır.');return}if(!navigator.geolocation){showError('Bu tarayıcı konum özelliğini desteklemiyor.');return}s.textContent='Konum alınıyor…';navigator.geolocation.getCurrentPosition(firstLocation,locationError,{enableHighAccuracy:true,timeout:30000,maximumAge:0})}function firstLocation(p){updateLocation(p);if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(updateLocation,()=>{}, {enableHighAccuracy:true,timeout:30000,maximumAge:5000})}function updateLocation(p){const lat=p.coords.latitude,lng=p.coords.longitude,acc=Math.round(p.coords.accuracy);document.getElementById('locDot').classList.add('live');document.getElementById('locValue').textContent='Canlı konumum';document.getElementById('locStatus').textContent='Aktif • yaklaşık '+acc+' m doğruluk';document.getElementById('mapFrame').src='https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng)+'&z=17&output=embed'}function locationError(err){let m='Konum alınamadı.';if(err.code===1)m='Konum izni reddedildi.';if(err.code===2)m='iPhone konumu şu anda bulamıyor.';if(err.code===3)m='Konum alınması zaman aşımına uğradı.';document.getElementById('locStatus').textContent='Konum alınamadı';showError(m)}function showError(m){const e=document.getElementById('errorBox');e.textContent=m;e.classList.add('show')}</script></body></html>
