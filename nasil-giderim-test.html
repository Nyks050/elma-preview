<main class="app"><h1>Nasıl giderim?</h1><div class="fields"><div class="inputs"><label class="field"><svg><use href="#origin"/></svg><input id="from" aria-label="Başlangıç konumu" placeholder="Bulunduğun konum" autocomplete="off"><button class="clear" data-clear="from" aria-label="Başlangıcı temizle">×</button></label><label class="field"><svg><use href="#pin"/></svg><input id="to" aria-label="Varış konumu" placeholder="Varış noktası" autocomplete="off"><button class="clear" data-clear="to" aria-label="Varışı temizle">×</button></label></div><button class="swap" id="swapButton" aria-label="Konumları değiştir"><svg><use href="#swap"/></svg></button></div><div class="suggestions" id="suggestions"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>

const $=id=>document.getElementById(id), icon=n=>'<svg aria-hidden="true"><use href="#'+n+'"/></svg>', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const distance=(a,b)=>{const r=Math.PI/180,h=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 12742000*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))};
let lines=[],stops=[],points={from:null,to:null},active='from',map,layers=[],results=[],selected=null,run=0,searchRun=0,searchTimer,searchAbort;
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,5500)}
function clearMap(){layers.forEach(l=>l.remove());layers=[]}
function empty(message){selected=null;results=[];$('options').replaceChildren();$('duration').textContent='Rotanı seç';$('badge').textContent='Amasya';$('steps').textContent=message;$('start').disabled=true;clearMap()}
function reset(){run++;empty('Başlangıç ve varış konumunu seç. Uygun hatlar otomatik hesaplanacak.')}
function prepare(data){
 const unique=new Map();
 for(const l of data.lines.filter(l=>l.id!=='11')){
  const route=l.route||[],all=l.stops||[];if(route.length<2||all.length<2)continue;
  let cursor=0;const indexed=all.map(s=>{let best=cursor,d=Infinity;for(let i=cursor;i<route.length;i++){const v=distance(s,{lat:route[i][0],lng:route[i][1]});if(v<d){d=v;best=i}}cursor=best;unique.set(s.id,s);return {...s,ri:best}});
  const pivot=l.returnStartIndex;
  const groups=Number.isInteger(pivot)&&pivot>0&&pivot<indexed.length-1?[indexed.slice(0,pivot+1),indexed.slice(pivot)]:[indexed];
  const prefix=[0];for(let i=1;i<route.length;i++)prefix.push(prefix[i-1]+distance({lat:route[i-1][0],lng:route[i-1][1]},{lat:route[i][0],lng:route[i][1]}));
  groups.forEach((ss,i)=>lines.push({id:l.id,key:l.id+'-'+i,label:l.id==='4-alt'?'4 ALT':l.id==='4-ust'?'4 ÜST':l.number,direction:i?'Dönüş':'Gidiş',stops:ss,route,prefix}));
 }
 stops=[...unique.values()];
}
const ride=(l,a,b)=>Math.max(.5,(l.prefix[l.stops[b].ri]-l.prefix[l.stops[a].ri])/300+(b-a)*.3);
function arrivals(l,start){
 let best=null;return l.stops.map((s,i)=>{
  if(i&&best)best={...best,cost:best.cost+ride(l,i-1,i)};
  const here=best?{...best,end:i}:null,walk=distance(start,s);
  if(walk<=700&&(!best||walk/75<best.cost))best={cost:walk/75,board:i,access:walk};
  return here;
 });
}
function candidates(from,to){
 const first=lines.map(l=>arrivals(l,from)),found=[];
 lines.forEach((l,li)=>l.stops.forEach((s,b)=>{
  const a=first[li][b],exit=distance(s,to);if(a&&exit<=700)found.push({score:a.cost+exit/75,legs:[{l,a:a.board,b}],access:a.access,exit,transfer:0});
 }));
 lines.forEach((second,si)=>{
  let best=null;
  second.stops.forEach((s,b)=>{
   if(b&&best)best={...best,cost:best.cost+ride(second,b-1,b)};
   const exit=distance(s,to);
   if(best&&exit<=700)found.push({score:best.cost+exit/75,legs:[best.leg,{l:second,a:best.board,b}],access:best.access,exit,transfer:best.transfer});
   lines.forEach((one,oi)=>{if(one.id===second.id)return;one.stops.forEach((t,j)=>{
    const before=first[oi][j];if(!before)return;const transfer=distance(t,s);if(transfer>200)return;
    const cost=before.cost+transfer/75+4;
    if(!best||cost<best.cost)best={cost,board:b,leg:{l:one,a:before.board,b:j},access:before.access,transfer};
   })});
  });
 });
 const seen=new Set();return found.sort((a,b)=>a.score-b.score).filter(r=>{const key=r.legs.map(x=>x.l.key).join('|');if(seen.has(key))return false;seen.add(key);return true}).slice(0,3);
}
async function walking(a,b){
 if(distance(a,b)<20)return {path:[[a.lat,a.lng],[b.lat,b.lng]],meters:distance(a,b),seconds:distance(a,b)/1.25};
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
 try{const r=await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson',{signal:controller.signal});if(!r.ok)throw Error();const d=await r.json(),v=d.routes?.[0];if(!v?.geometry?.coordinates?.length)throw Error();return {path:v.geometry.coordinates.map(p=>[p[1],p[0]]),meters:v.distance,seconds:v.duration}}finally{clearTimeout(timer)}
}
async function calculate(){
 if(!points.from||!points.to)return;
 if(!lines.length)return toast('Hat verileri henüz hazır değil.');
 const token=++run,from={...points.from},to={...points.to};empty('Uygun hatlar ve yürüyüş bağlantıları hesaplanıyor…');
 const choices=candidates(from,to);
 if(!choices.length){empty('Kayıtlı Amasya hatlarında bu iki noktayı bağlayan direkt veya tek aktarmalı rota bulunamadı. Başka bir nokta seç.');return}
 const checked=await Promise.all(choices.map(async r=>{try{
  const first=r.legs[0],last=r.legs.at(-1);
  const tasks=[walking(from,first.l.stops[first.a]),walking(last.l.stops[last.b],to)];
  if(r.legs.length===2)tasks.push(walking(first.l.stops[first.b],last.l.stops[last.a]));
  const walks=await Promise.all(tasks);if(walks[0].meters>1000||walks[1].meters>1000||(walks[2]&&walks[2].meters>350))return null;
  return {...r,walks,minutes:Math.ceil(walks.reduce((s,w)=>s+w.seconds/60,0)+r.legs.reduce((s,g)=>s+ride(g.l,g.a,g.b),0)),from,to};
 }catch{return null}}));
 if(token!==run)return;
 results=checked.filter(Boolean).sort((a,b)=>a.minutes-b.minutes);
 if(!results.length){empty('Hat adayları bulundu ancak yürüyüş bağlantıları doğrulanamadı. Bağlantını kontrol edip yeniden hesapla.');toast('Yaya rota servisi yanıt vermemiş veya yürüyüş mesafesi sınırı aşılmış olabilir.');return}
 $('options').innerHTML=results.map((r,i)=>'<button class="option '+(!i?'selected':'')+'" data-route="'+i+'">'+(!i?'<span class="badge">Önerilen</span>':'')+'<strong>≈ '+r.minutes+' dk</strong><span class="lines">'+esc(r.legs.map(g=>g.l.label).join(' → '))+'</span><span class="meta">'+icon('walk')+Math.ceil(r.walks.reduce((s,w)=>s+w.seconds/60,0))+' dk yürü<span class="divider"></span>'+icon('transfer')+(r.legs.length-1)+' aktarma</span></button>').join('');
 document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('selected',x===b));draw(results[+b.dataset.route])});draw(results[0]);
}
function draw(r){
 selected=r;clearMap();$('duration').textContent='≈ '+r.minutes+' dk';$('badge').textContent='Tahmini';$('start').disabled=false;
 const rows=[],paths=[];
 const addWalk=(w,title)=>{rows.push(['walk',title,Math.ceil(w.seconds/60)+' dk · '+Math.round(w.meters)+' m']);paths.push(w.path);if(map)layers.push(L.polyline(w.path,{color:'#111',weight:4,dashArray:'1 7',lineCap:'round'}).addTo(map))};
 addWalk(r.walks[0],r.legs[0].l.stops[r.legs[0].a].name+' durağına yürü');
 r.legs.forEach((g,i)=>{
  const a=g.l.stops[g.a],b=g.l.stops[g.b],path=g.l.route.slice(a.ri,b.ri+1);paths.push(path);
  if(map){layers.push(L.polyline(path,{color:'#111',weight:5}).addTo(map));layers.push(L.marker([a.lat,a.lng],{icon:L.divIcon({className:'route-label',html:'Hat '+esc(g.l.label),iconSize:null})}).addTo(map))}
  rows.push(['bus',a.name+' durağından '+g.l.label+' numaralı hatta bin',g.l.direction+' · '+(g.b-g.a)+' durak · '+b.name+' durağında in']);
  if(i===0&&r.legs.length>1)addWalk(r.walks[2],r.legs[1].l.stops[r.legs[1].a].name+' durağına aktarma yap');
 });
 addWalk(r.walks[1],'Varış noktasına yürü');rows.push(['pin',r.to.name,'Varış']);
 $('steps').innerHTML=rows.map(x=>'<div class="step '+(x[0]==='walk'?'walk':'')+'"><time>—</time><span class="node"></span>'+icon(x[0])+'<div><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small></div></div>').join('');
 $('notice').textContent='Amasya kayıtlı hatları ve yaya yol ağı kullanılır. Süre tahminidir; otobüs bekleme ve trafik dahil değildir. Canlı sefer saati mevcut değil.';
 if(map&&paths.flat().length)map.fitBounds(paths.flat(),{padding:[25,25],maxZoom:16});
}
function choose(p,id=active){run++;points[id]=p;$(id).value=p.name;$('suggestions').replaceChildren();searchRun++;searchAbort?.abort();if(id==='from'&&!points.to){active='to';$('to').focus()}if(map)map.setView([p.lat,p.lng],14);calculate()}
const norm=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function showSuggestions(items,id,token){
 if(token!==searchRun)return;$('suggestions').replaceChildren();
 for(const p of items.slice(0,8)){const b=document.createElement('button');b.type='button';b.textContent=p.name+(p.detail?' · '+p.detail:' · Amasya');b.onclick=()=>choose(p,id);$('suggestions').appendChild(b)}
}
async function search(id){
 const token=++searchRun,q=$(id).value.trim();searchAbort?.abort();
 const local=stops.filter(s=>norm(s.name).includes(norm(q))).slice(0,6);showSuggestions(local,id,token);
 if(q.length<2)return;
 searchAbort=new AbortController();const ctl=searchAbort,timer=setTimeout(()=>ctl.abort(),8000);
 try{
 const url='https://photon.komoot.io/api/?q='+encodeURIComponent(q+' Amasya')+'&lat=40.65&lon=35.83&limit=8';
 const response=await fetch(url,{signal:ctl.signal});if(!response.ok)throw Error();const data=await response.json();
 const places=(data.features||[]).map(f=>({lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],name:f.properties.name||f.properties.street||q,detail:[f.properties.street,f.properties.district,f.properties.city].filter(Boolean).join(', ')})).filter(p=>p.lat>=40.2&&p.lat<=41.1&&p.lng>=35.1&&p.lng<=36.6);
 const seen=new Set(),items=[...local,...places].filter(p=>{const key=p.name+p.lat.toFixed(4);if(seen.has(key))return false;seen.add(key);return true});
 showSuggestions(items,id,token);if(!items.length&&token===searchRun){const n=document.createElement('p');n.textContent='Adres bulunamadı. Mahalle/sokak adı ekle veya haritada seç.';$('suggestions').appendChild(n)}
 }catch{if(token===searchRun&&!local.length){const n=document.createElement('p');n.textContent='Adres önerileri alınamadı. Durak adı yazabilir veya haritaya dokunabilirsin.';$('suggestions').replaceChildren(n)}}finally{clearTimeout(timer)}
}
for(const id of ['from','to']){$(id).onfocus=()=>{active=id;search(id)};$(id).oninput=()=>{active=id;points[id]=null;reset();searchRun++;searchAbort?.abort();clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(id),400)}}
document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const id=b.dataset.clear;points[id]=null;$(id).value='';reset();$(id).focus()});
$('swapButton').onclick=()=>{[points.from,points.to]=[points.to,points.from];[$('from').value,$('to').value]=[$('to').value,$('from').value];reset();calculate()};
$('locateButton').onclick=()=>{if(!navigator.geolocation)return toast('Konum desteklenmiyor. Haritadan seç.');toast('Konumun alınıyor…');navigator.geolocation.getCurrentPosition(p=>choose({lat:p.coords.latitude,lng:p.coords.longitude,name:'Mevcut konumum'},'from'),()=>toast('Konum alınamadı. Konum izni ver veya başlangıç noktasını haritadan seç.'),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})};
$('start').onclick=()=>{if(!selected)return;document.querySelector('.journey').scrollIntoView({behavior:'smooth',block:'start'});toast('Yolculuk adımları aşağıda. Canlı araç takibi ve sesli navigasyon yok.')};
document.querySelector('.nav').innerHTML=['Ulaşım','Şehir','QR','İlanlar','Hesap'].map((n,i)=>'<button class="'+(!i?'active':'')+'">'+icon(['bus','city','qr','ads','account'][i])+n+'</button>').join('');
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>toast('Bu bağımsız test sayfasında rota planlamayı deniyoruz.'));
if(window.L){map=L.map('map',{zoomControl:false}).setView([40.65,35.83],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);map.on('click',e=>choose({lat:e.latlng.lat,lng:e.latlng.lng,name:active==='from'?'Haritadan başlangıç':'Haritadan varış'}))}else toast('Harita yüklenemedi. Sayfayı yenile.');
reset();$('notice').textContent='Adres yazıp önerilerden seçebilir veya ilgili kutuya dokunduktan sonra haritadan nokta seçebilirsin.';
fetch('assets/amasya-transit-data.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{prepare(d);calculate()}).catch(()=>{empty('Hat verileri yüklenemedi. Sayfayı yenile.');toast('Hat verileri alınamadı.')});

</script></body></html>
