function prepare(data){
 const unique=new Map();

  const route=l.route||[],all=l.stops||[];if(route.length<2||all.length<2)continue;
  let cursor=0;const indexed=all.map(s=>{let best=cursor,d=Infinity;for(let i=cursor;i<route.length;i++){const v=distance(s,{lat:route[i][0],lng:route[i][1]});if(v<d){d=v;best=i}}cursor=best;unique.set(s.id,s);return {...s,ri:best}});

const BUS_METERS_PER_MINUTE=30000/60;
const ride=(l,a,b)=>Math.max(.5,(l.prefix[l.stops[b].ri]-l.prefix[l.stops[a].ri])/BUS_METERS_PER_MINUTE);

  if(i&&best)best={...best,cost:best.cost+ride(l,i-1,i)};

}

 for(const l of lines){let best=null;for(let a=0;a<l.stops.length-1;a++)for(let b=a+1;b<l.stops.length;b++){const access=distance(from,l.stops[a]),exit=distance(l.stops[b],to),score=access/75+ride(l,a,b)+exit/75;if(!best||score<best.score)best={score,legs:[{l,a,b}],access,exit,transfer:0,fallback:true}}if(best)found.push(best)}

 lines.forEach((l,li)=>l.stops.forEach((s,b)=>{
  const a=first[li][b],exit=distance(s,to);if(a&&exit<=700)found.push({score:a.cost+exit/75,legs:[{l,a:a.board,b}],access:a.access,exit,transfer:0});
 }));

   if(b&&best)best={...best,cost:best.cost+ride(second,b-1,b)};
   const exit=distance(s,to);
   if(best&&exit<=700)found.push({score:best.cost+exit/75,legs:[best.leg,{l:second,a:best.board,b}],access:best.access,exit,transfer:best.transfer});
   lines.forEach((one,oi)=>{if(one.key===second.key)return;one.stops.forEach((t,j)=>{
    const before=first[oi][j];if(!before)return;const transfer=distance(t,s);if(transfer>200)return;

   })});

async function calculate(){

}
function draw(r){

 const addWalk=(w,title,kind='walk')=>{rows.push([kind,title,Math.ceil(w.seconds/60)+' dk · '+Math.round(w.meters)+' m',stamp()]);elapsed+=w.seconds/60;paths.push(w.path);if(map)layers.push(L.polyline(w.path,{color:'#111',weight:4,dashArray:'1 7',lineCap:'round'}).addTo(map))};
 addWalk(r.walks[0],'Bulunduğun konumdan yürü');
 label([r.from.lat,r.from.lng],icon('origin'),'route-pin');
 const wp=r.walks[0].path[Math.floor(r.walks[0].path.length/2)];label(wp,icon('walk')+Math.ceil(r.walks[0].seconds/60)+' dk yürü');
 r.legs.forEach((g,i)=>{
  const a=g.l.stops[g.a],b=g.l.stops[g.b],path=g.l.route.slice(a.ri,b.ri+1);paths.push(path);
  if(map){layers.push(L.polyline(path,{color:'#111',weight:5}).addTo(map));label(path[Math.floor(path.length/2)]||[a.lat,a.lng],icon('bus')+esc(g.l.label),'route-label');layers.push(L.circleMarker([a.lat,a.lng],{radius:5,color:'#111',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map))}
  const rideMinutes=ride(g.l,g.a,g.b);
  rows.push(['bus','Haritada gösterilen durakta '+g.l.label+' numaralı hatta bin',Math.ceil(rideMinutes)+' dk · '+(g.b-g.a)+' durak',stamp()]);elapsed+=rideMinutes;
  rows.push(['bus','Haritada gösterilen durakta in','Otobüs yolculuğu tamamlandı',stamp()]);
  if(i===0&&r.legs.length>1){addWalk(r.walks[2],'Haritada gösterilen durakta aktarma yap','transfer');label([b.lat,b.lng],icon('transfer')+'1 aktarma')}
 });
 addWalk(r.walks[1],'Varış noktasına yürü');rows.push(['pin','Varış noktasına ulaş',r.to.name,stamp()]);label([r.to.lat,r.to.lng],icon('pin'),'route-pin');
 $('steps').innerHTML=rows.map(x=>'<div class="step '+(x[0]==='walk'?'walk':'')+'"><time>'+x[3]+'</time><span class="node"></span>'+icon(x[0])+'<div><b>'+esc(x[1])+'</b><small>'+esc(x[2]).replace(/\n/g,'<br>')+'</small></div></div>').join('');
 if(map&&paths.flat().length)map.fitBounds(paths.flat(),{padding:[25,25],maxZoom:16});
}
function choose(p,id=active){run++;points[id]=p;$(id).value=p.name;$('suggestions').replaceChildren();searchRun++;searchAbort?.abort();if(id==='from'&&!points.to){active='to';$('to').focus()}if(map)map.setView([p.lat,p.lng],14);calculate()}
const norm=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
const knownPlaces=[{lat:40.61779,lng:35.77882,name:'15. Piyade Eğitim Tugayı',detail:'General Hikmet Akıncı Kışlası, Yazıbağları',aliases:'15. Eğitim Tugayı 15 Piyade Eğitim Tugay Komutanlığı General Hikmet Akıncı Kışlası'}];
function showSuggestions(items,id,token){
 if(token!==searchRun)return;$('suggestions').replaceChildren();
 for(const p of items.slice(0,8)){const b=document.createElement('button');b.type='button';b.textContent=p.name+(p.detail?' · '+p.detail:' · Amasya');b.onclick=()=>choose(p,id);$('suggestions').appendChild(b)}
}
async function search(id){
 const token=++searchRun,q=$(id).value.trim();searchAbort?.abort();
 if(!q){showSuggestions([],id,token);return}
 const nq=norm(q),known=knownPlaces.filter(p=>norm(p.name+' '+p.detail+' '+p.aliases).includes(nq)),local=stops.filter(s=>!/^Durak\s+\d+$/i.test(s.name)&&norm(s.name).includes(nq)).slice(0,6),initial=[...known,...local];showSuggestions(initial,id,token);
 if(q.length<2)return;
 searchAbort=new AbortController();const ctl=searchAbort,timer=setTimeout(()=>ctl.abort(),8000);
 try{
 const url='https://photon.komoot.io/api/?q='+encodeURIComponent(q+' Amasya')+'&lat=40.65&lon=35.83&limit=8';
 const response=await fetch(url,{signal:ctl.signal});if(!response.ok)throw Error();const data=await response.json();
 const places=(data.features||[]).map(f=>({lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],name:f.properties.name||f.properties.street||q,detail:[f.properties.street,f.properties.district,f.properties.city].filter(Boolean).join(', ')})).filter(p=>p.lat>=40.2&&p.lat<=41.1&&p.lng>=35.1&&p.lng<=36.6);
 const seen=new Set(),items=[...initial,...places].filter(p=>{const key=p.name+p.lat.toFixed(4);if(seen.has(key))return false;seen.add(key);return true});
 showSuggestions(items,id,token);if(!items.length&&token===searchRun){const n=document.createElement('p');n.textContent='Adres bulunamadı. Mahalle/sokak adı ekle veya haritada seç.';$('suggestions').appendChild(n)}
 }catch{if(token===searchRun&&!initial.length){const n=document.createElement('p');n.textContent='Adres önerileri alınamadı. Durak adı yazabilir veya haritaya dokunabilirsin.';$('suggestions').replaceChildren(n)}}finally{clearTimeout(timer)}
}
for(const id of ['from','to']){$(id).onfocus=()=>{active=id;search(id)};$(id).oninput=()=>{active=id;points[id]=null;reset();searchRun++;searchAbort?.abort();clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(id),400)}}
document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const id=b.dataset.clear;points[id]=null;$(id).value='';reset();$(id).focus()});
$('swapButton').onclick=()=>{[points.from,points.to]=[points.to,points.from];[$('from').value,$('to').value]=[$('to').value,$('from').value];reset();calculate()};
function useCurrentLocation(){if(!navigator.geolocation)return toast('Konum desteklenmiyor. Haritadan seç.');toast('Konumun alınıyor…');navigator.geolocation.getCurrentPosition(p=>choose({lat:p.coords.latitude,lng:p.coords.longitude,name:'Mevcut konumum'},'from'),()=>toast('Konum alınamadı. Konum izni ver veya başlangıç noktasını haritadan seç.'),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
$('topLocateButton').onclick=useCurrentLocation;
document.querySelector('.nav').innerHTML=['Ulaşım','Şehir','QR','İlanlar','Hesap'].map((n,i)=>'<button class="'+(!i?'active':'')+'">'+icon(['bus','city','qr','ads','account'][i])+n+'</button>').join('');
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>toast('Bu bağımsız test sayfasında rota planlamayı deniyoruz.'));
if(window.L){map=L.map('map',{zoomControl:false}).setView([40.65,35.83],13);map.attributionControl.setPrefix(false);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);map.on('click',e=>choose({lat:e.latlng.lat,lng:e.latlng.lng,name:active==='from'?'Haritadan başlangıç':'Haritadan varış'}))}else toast('Harita yüklenemedi. Sayfayı yenile.');
reset();
fetch('assets/amasya-transit-data.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{prepare(d);calculate()}).catch(()=>{empty('Hat verileri yüklenemedi. Sayfayı yenile.');toast('Hat verileri alınamadı.')});

</script></body></html>
