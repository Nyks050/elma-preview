<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nasıl giderim? · ElmaGo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#090909;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}svg:not(.leaflet-zoom-animated){width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.app{max-width:460px;margin:auto;background:#fafafa;min-height:100dvh;padding:calc(23px + env(safe-area-inset-top)) 18px calc(95px + env(safe-area-inset-bottom))}h1{font-size:32px;line-height:1.1;letter-spacing:-1.3px;margin:0 7px 12px;font-weight:800}.fields{display:grid;grid-template-columns:1fr 41px;gap:7px;margin:0 8px 9px}.inputs{display:grid;gap:6px}.field{height:40px;display:flex;align-items:center;border:1px solid #ddd;border-radius:11px;background:linear-gradient(#fafafa,#f6f6f6);overflow:hidden}.field>svg{margin:0 10px;width:20px;height:20px}.field input{width:100%;min-width:0;background:none;border:0;outline:0;font-size:14px;padding:0 5px 0 0}.field input::placeholder{color:#101010;opacity:1}.clear{border:0;background:none;color:#777;padding:8px;font-size:23px;font-weight:200}.swap{align-self:center;height:47px;border:1px solid #ddd;border-radius:11px;background:#fff;display:grid;place-items:center}.suggestions{margin:0 8px 8px;max-height:220px;overflow:auto}.suggestions:empty{display:none}.suggestions button{display:block;width:100%;background:#fff;border:0;border-bottom:1px solid #eee;padding:13px;text-align:left;font-size:13px}.mapbox{position:relative;height:205px;border-radius:14px;overflow:hidden;background:#dedede;margin-bottom:9px}#map{height:100%;width:100%;z-index:0}.leaflet-tile-pane{filter:grayscale(1) contrast(.75) brightness(1.12)}.leaflet-control-attribution{font-size:8px!important}.locate{position:absolute;right:9px;bottom:16px;z-index:500;width:39px;height:39px;background:#fff;border:0;border-radius:50%;box-shadow:0 4px 10px #0002;display:grid;place-items:center}.locate svg{fill:#111;width:22px;height:22px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.option{position:relative;min-width:0;min-height:132px;border:1px solid #dedede;border-radius:13px;background:linear-gradient(120deg,#fff,#fafafa);padding:35px 13px 12px;text-align:left}.option.selected{border:2px solid #111;padding:34px 12px 11px}.badge{display:inline-block;background:#090909;color:#fff;border-radius:8px;padding:4px 11px;font-size:12px;line-height:1;white-space:nowrap}.option .badge{position:absolute;top:7px;left:12px}.option strong{display:block;font-size:29px;letter-spacing:-.9px;line-height:1.1}.option .lines{display:block;font-size:17px;margin:3px 0 10px;font-weight:600}.option .arrow{position:absolute;right:11px;top:42px;width:13px;color:#555}.meta{display:flex;gap:8px;align-items:center;font-size:11px;color:#444;white-space:nowrap}.meta svg{width:17px;height:17px}.meta .divider{height:14px;width:1px;background:#aaa;margin:0 3px}.journey{background:linear-gradient(120deg,#fff,#fafafa);border:1px solid #ececec;border-radius:18px;padding:11px 13px 0}.journey-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:4px;margin-bottom:10px}.journey-head strong{font-size:25px;letter-spacing:-.6px}.journey-head .badge{font-size:11px;padding:5px 9px}.step{position:relative;display:grid;grid-template-columns:37px 18px 25px 1fr;column-gap:7px;min-height:65px}.step time{font-size:11px;padding-top:3px}.node{position:relative;width:9px;height:9px;border-radius:50%;background:#111;top:6px;left:1px}.step:not(:last-child) .node:after{content:'';position:absolute;width:2px;height:54px;top:12px;left:3px;background:#111}.step.walk .node:after{background:none;border-left:2px dotted #aaa}.step>svg{width:20px;height:23px}.step b{display:block;font-size:12px;line-height:1.35;font-weight:600}.step small{display:block;font-size:11px;line-height:1.5;color:#818181;margin-top:2px}.step:last-child{min-height:38px}.start{display:flex;justify-content:center;align-items:center;gap:15px;width:100%;height:44px;border:0;background:#111;color:#fff;border-radius:20px;margin-top:10px;font-size:16px;font-weight:500}.start svg{fill:currentColor;width:20px}.notice{font-size:10px;color:#757575;line-height:1.5;margin:10px 3px 0}.notice button{border:0;background:none;text-decoration:underline;padding:0;font-size:inherit}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fafafaf5;border-top:1px solid #e5e5e5;padding:6px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:600}.nav button{position:relative;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10px;color:#777}.nav svg{width:23px;height:23px}.nav .active{color:#111;font-weight:600}.nav .active:after{content:'';position:absolute;bottom:-6px;width:34px;height:3px;border-radius:9px;background:#111}.route-label{white-space:nowrap;width:max-content;border-radius:7px;padding:4px 7px;background:#111;color:#fff;font:bold 12px Arial}.map-hint{background:#fff;color:#111;box-shadow:0 2px 8px #0001;border-radius:6px;padding:5px 7px;white-space:nowrap;font-size:11px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:410px;background:#111;color:#fff;padding:15px;border-radius:14px;z-index:900;font-size:13px;box-shadow:0 8px 25px #0003}.toast[hidden]{display:none}@media(min-width:600px){.app{margin:25px auto;border:1px solid #ddd;border-radius:26px}.nav{border-left:1px solid #ddd;border-right:1px solid #ddd}}@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.meta{gap:4px;font-size:10px}.step{column-gap:4px}.step b{font-size:11px}}
/* Leaflet owns its overlay SVG dimensions; icon sizes must not clip route paths. */
.leaflet-overlay-pane svg{max-width:none;max-height:none}
</style></head><body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="bus" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="17" rx="3"/><path d="M5 12h14M8 20v2m8-2v2M8 6h8"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></symbol>
<symbol id="walk" viewBox="0 0 24 24"><circle cx="14" cy="3" r="1.5"/><path d="m12 7-3 6-4 2m7-8 4 5 4 1m-8-6-1 10-4 6m4-10 5 5 1 5"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22S4 13 4 8a8 8 0 0 1 16 0c0 5-8 14-8 14Z"/><circle fill="white" stroke="white" cx="12" cy="8" r="2"/></symbol>
<symbol id="origin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#aaa"/><circle cx="12" cy="12" r="6" fill="currentColor"/></symbol>
<symbol id="transfer" viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></symbol>
<symbol id="swap" viewBox="0 0 24 24"><path d="M7 21V3m-4 4 4-4 4 4m6-4v18m-4-4 4 4 4-4"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="locate" viewBox="0 0 24 24"><path d="m21 3-7 18-3-8-8-3Z"/></symbol>
<symbol id="city" viewBox="0 0 24 24"><path d="m3 5 6-3 6 3 6-3v17l-6 3-6-3-6 3Zm6-3v17m6-14v17"/></symbol>
<symbol id="qr" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h3v3h3m-6 3h3m3-6v-3M12 3v3M3 12h3"/></symbol>
<symbol id="ads" viewBox="0 0 24 24"><path d="m3 9 17-6v17L3 14Zm4 7 2 6h4l-3-7M3 9v5"/></symbol>
<symbol id="account" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M3 22a9 9 0 0 1 18 0Z"/></symbol></defs></svg>
<main class="app"><h1>Nasıl giderim?</h1><div class="fields"><div class="inputs"><label class="field"><svg><use href="#origin"/></svg><input id="from" aria-label="Başlangıç konumu" placeholder="Bulunduğun konum" autocomplete="off"><button class="clear" data-clear="from" aria-label="Başlangıcı temizle">×</button></label><label class="field"><svg><use href="#pin"/></svg><input id="to" aria-label="Varış konumu" placeholder="Varış noktası" autocomplete="off"><button class="clear" data-clear="to" aria-label="Varışı temizle">×</button></label></div><button class="swap" id="swapButton" aria-label="Konumları değiştir"><svg><use href="#swap"/></svg></button></div><div class="suggestions" id="suggestions"></div>
<div class="mapbox"><div id="map" aria-label="Rota haritası"></div><button class="locate" id="locateButton" aria-label="Mevcut konumumu seç"><svg><use href="#locate"/></svg></button></div>
<div class="options" id="options"></div><section class="journey"><header class="journey-head"><strong id="duration">28 dk</strong><span class="badge" id="badge">En hızlı</span></header><div id="steps"></div></section>
<button class="start" id="start"><svg><use href="#locate"/></svg>Yolculuğu başlat</button><p class="notice" id="notice">Görsel örneği: Bursa, 12A ve 6B temsili tasarım verileridir. Gerçek Amasya durakları için üstteki alanlardan seçim yap. <button id="demo">Görsel örneğine dön</button></p>
</main><nav class="nav" aria-label="Alt menü"></nav><div class="toast" role="status" id="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id),icon=name=>'<svg aria-hidden="true"><use href="#'+name+'"/></svg>',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lines=[],points={from:null,to:null},active='from',map,layers=[],results=[],demoMode=true;
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,4500)}
document.querySelector('.nav').innerHTML=['Ulaşım','Şehir','QR','İlanlar','Hesap'].map((n,i)=>'<button class="'+(!i?'active':'')+'" type="button">'+icon(['bus','city','qr','ads','account'][i])+n+'</button>').join('');
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>toast('Bu bağımsız sayfada yalnızca rota tasarımını test ediyoruz.'));
function cards(items){$('options').innerHTML=items.map((r,i)=>'<button class="option '+(!i?'selected':'')+'" data-route="'+i+'">'+(!i?'<span class="badge">'+(demoMode?'En hızlı':'Tahmini')+'</span>':'')+'<strong>'+r.minutes+' dk</strong><span class="lines">'+esc(r.label)+'</span>'+icon('arrow').replace('<svg','<svg class="arrow"')+'<span class="meta">'+icon('walk')+r.walk+' dk yürü<span class="divider"></span>'+icon('transfer')+(r.transfer?'1 aktarma':'Aktarmasız')+'</span></button>').join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('selected',x===b));if(!demoMode)drawReal(results[+b.dataset.route]);else{$('duration').textContent=items[+b.dataset.route].minutes+' dk'}})}
function timeline(rows){$('steps').innerHTML=rows.map(r=>'<div class="step '+(r[1]==='walk'?'walk':'')+'"><time>'+esc(r[0])+'</time><span class="node"></span>'+icon(r[1])+'<div><b>'+esc(r[2])+'</b><small>'+esc(r[3])+(r[4]?'<br>'+esc(r[4]):'')+'</small></div></div>').join('')}
function clearMap(){layers.forEach(x=>x.remove());layers=[]}function line(path,walk=false){if(map)layers.push(L.polyline(path,{color:'#111',weight:walk?4:5,dashArray:walk?'1 7':null,lineCap:'round'}).addTo(map))}function label(p,s,cls='route-label'){if(map)layers.push(L.marker(p,{icon:L.divIcon({className:cls,html:esc(s),iconSize:null})}).addTo(map))}
function demo(){demoMode=true;cards([{minutes:28,label:'12A → 6B',walk:5,transfer:true},{minutes:34,label:'12A → 6B',walk:5,transfer:true}]);$('duration').textContent='28 dk';$('badge').textContent='En hızlı';timeline([['09:41','walk','Bulunduğun konumdan yürü','5 dk · 350 m'],['09:46','bus','Görükle Meydan durağından 12A otobüsüne bin','12A · Uludağ Üniversitesi yönü','12 dk · 8 durak'],['09:58','transfer','Küçük Sanayi durağında aktarma yap','4 dk bekleme'],['10:02','bus','6B otobüsüne bin','6B · Bursa Merkez yönü','14 dk · 10 durak'],['10:16','pin','Varış noktasına ulaş','Varış']]);if(!map)return;clearMap();const p=[[40.223,28.855],[40.227,28.87],[40.216,28.90],[40.212,28.941],[40.217,28.968],[40.206,28.993],[40.205,29.03],[40.217,29.06]];line(p.slice(0,3),true);line(p.slice(2,6));line(p.slice(5),true);label(p[2],'▣ 12A');label(p[5],'▣ 6B');label([40.238,28.87],'♟ 5 dk yürü','map-hint');label([40.237,28.969],'⇆ 1 aktarma','map-hint');[p[0],p[4],p[7]].forEach(x=>layers.push(L.circleMarker(x,{radius:6,color:'#fff',weight:3,fillColor:'#111',fillOpacity:1}).addTo(map)));map.fitBounds(p,{padding:[25,35]})}
const dist=(a,b)=>{const rad=Math.PI/180,x=(b.lat-a.lat)*rad,y=(b.lng-a.lng)*rad,h=Math.sin(x/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(y/2)**2;return 12742000*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))};
function route(){if(!points.from||!points.to)return;results=[];for(const l of lines){const stops=l.stops||[],prefix=[0];for(let i=1;i<stops.length;i++)prefix.push(prefix[i-1]+dist(stops[i-1],stops[i]));let best;for(let a=0;a<stops.length-1;a++){const access=dist(points.from,stops[a]);if(access>700)continue;for(let b=a+1;b<stops.length;b++){const exit=dist(stops[b],points.to);if(exit>700)continue;const minutes=Math.ceil((access+exit)/75+(prefix[b]-prefix[a])/300+(b-a)*.3);if(!best||minutes<best.minutes)best={l,a,b,access,exit,minutes,label:'Hat '+(l.id==='4-alt'?'4 ALT':l.id==='4-ust'?'4 ÜST':l.number),walk:Math.ceil((access+exit)/75),transfer:false}}}if(best)results.push(best)}results.sort((a,b)=>a.minutes-b.minutes);results=results.slice(0,2);demoMode=false;if(!results.length){$('options').innerHTML='';$('steps').innerHTML='<p>Bu iki nokta için kayıtlı veride uygun direkt hat bulunamadı. Aktarmalı rota henüz hesaplanmıyor.</p>';$('duration').textContent='Rota yok';$('badge').textContent='';clearMap();return}cards(results);drawReal(results[0])}
function drawReal(r){$('duration').textContent=r.minutes+' dk';$('badge').textContent='Tahmini';const a=r.l.stops[r.a],b=r.l.stops[r.b];timeline([['—','walk','Bulunduğun konumdan yürü',Math.ceil(r.access/75)+' dk · yaklaşık '+Math.round(r.access)+' m'],['—','bus',a.name+' durağından '+r.label+' aracına bin',(r.b-r.a)+' durak · Kayıtlı durak sırası'],['—','walk',b.name+' durağında in',Math.ceil(r.exit/75)+' dk · yaklaşık '+Math.round(r.exit)+' m'],['—','pin','Varış noktasına ulaş',points.to.name]]);$('notice').textContent='Amasya kayıtlı hat verisi · Süreler yaklaşık; bekleme süresi dahil değil. Kesikli yürüme bağlantıları kuş uçuşudur. Canlı sefer ve aktarma hesaplaması henüz yok.';clearMap();const path=r.l.route||[],nearest=(p,start=0)=>{let at=start,d=Infinity;for(let i=start;i<path.length;i++){let v=dist(p,{lat:path[i][0],lng:path[i][1]});if(v<d){d=v;at=i}}return at};const i=nearest(a),j=nearest(b,i),segment=path.slice(i,j+1);line(segment);line([[points.from.lat,points.from.lng],[a.lat,a.lng]],true);line([[b.lat,b.lng],[points.to.lat,points.to.lng]],true);label([a.lat,a.lng],r.label);if(map)map.fitBounds([[points.from.lat,points.from.lng],[points.to.lat,points.to.lng],...segment],{padding:[25,25]})}
function choose(p){points[active]=p;$(active).value=p.name;$('suggestions').replaceChildren();if(active==='from'&&!points.to)active='to';route()}
for(const id of ['from','to']){$(id).onfocus=()=>{active=id;search()};$(id).oninput=()=>{active=id;points[id]=null;search()}}function search(){let q=$(active).value.toLocaleLowerCase('tr');let seen=new Set();const stops=lines.flatMap(l=>l.stops).filter(s=>{if(seen.has(s.id))return false;seen.add(s.id);return s.name.toLocaleLowerCase('tr').includes(q)}).slice(0,8);$('suggestions').replaceChildren();for(const s of stops){const b=document.createElement('button');b.textContent=s.name+' · Amasya';b.onclick=()=>choose(s);$('suggestions').appendChild(b)}}
document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{const id=b.dataset.clear;points[id]=null;$(id).value='';active=id;$(id).focus()});$('swapButton').onclick=()=>{[points.from,points.to]=[points.to,points.from];[$('from').value,$('to').value]=[$('to').value,$('from').value];route()};$('locateButton').onclick=()=>{if(!navigator.geolocation)return toast('Konum desteklenmiyor. Haritadan seçebilirsin.');navigator.geolocation.getCurrentPosition(p=>{active='from';choose({lat:p.coords.latitude,lng:p.coords.longitude,name:'Mevcut konumum'});map?.setView([p.coords.latitude,p.coords.longitude],14)},()=>toast('Konum alınamadı. İzin ver veya haritadan seç.'))};$('start').onclick=()=>toast(demoMode?'Bu ekran görsel örnektir. Amasya duraklarını seçerek rota dene.':'Rota özeti hazır. Canlı navigasyon bu testte henüz etkin değil.');$('demo').onclick=demo;
if(window.L){map=L.map('map',{zoomControl:false}).setView([40.215,28.96],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);map.on('click',e=>choose({lat:e.latlng.lat,lng:e.latlng.lng,name:active==='from'?'Haritadan seçilen başlangıç':'Haritadan seçilen varış'}))}else toast('Harita yüklenemedi. İnternet bağlantını kontrol et.');demo();
fetch('assets/amasya-transit-data.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{lines=d.lines.filter(l=>l.id!=='11');$('from').addEventListener('focus',()=>{if(demoMode&&map)map.setView([40.65,35.83],13)})}).catch(()=>toast('Amasya hat verileri yüklenemedi; yalnızca görsel örneği gösteriliyor.'));
</script></body></html>
